tags: ["e2e"]

project:
  name: "drawer"
  description: "Drawer primitive — slide-in panel from screen edge"
tasks:
  # Inherit build, lint, typecheck and test from .moon/tasks/*.yml.
  e2e:
    # Owned by the component suite (packages/<tier>/<name>/e2e) and by the
    # dedicated matrix job in ci.yml. moon ci must not run it again.
    options:
      runInCI: skip
    args: ["packages/primitives/drawer/e2e"]
    env:
      PW_PROFILE: "smoke"
