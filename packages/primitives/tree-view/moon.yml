# The Moon project graph does not read package.json dependencies for tasks —
# it reads this. `tools/sync-moon-deps.ts` keeps the two in step; an edge
# package.json cannot express is hand-declared here with a `# preserved`
# marker (this file carries none — both edges are expressible).
deps:
  - core
  - labels
tags: ["layer-primitives", "e2e"]
project:
  name: tree-view
  description: Hierarchical tree with keyboard navigation, lazy branches and single or multiple selection.
tasks:
  # Inherit lint and test from .moon/tasks/*.yml.
  e2e:
    options:
      runInCI: skip
    args: ["packages/primitives/tree-view/e2e"]
    env:
      PW_PROFILE: "smoke"
