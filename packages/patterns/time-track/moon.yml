deps:
  - "core"
tags: ["layer-patterns", "e2e"]
project:
  name: "time-track"
  description: "Time track pattern — duration bars positioned proportionally on a shared ruler"
tasks:
  # Inherit lint and test from .moon/tasks/*.yml.
  e2e:
    # Runs this pattern's own browser evidence through the lightweight
    # harness (playwright/harness/playwright.config.ts), which mounts the
    # demo via a Vite dev server — no docs build. `runInCI: skip`: the
    # dedicated e2e matrix job owns component browser evidence on PRs; moon ci
    # in verify never runs it, so verify does not need browsers installed.
    # `moon run :e2e --affected` still fires it, scoped to this pattern's own
    # e2e dir.
    options:
      runInCI: skip
    args: ["packages/patterns/time-track/e2e"]
    env:
      PW_PROFILE: "smoke"
