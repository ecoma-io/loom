name: Docs

# The documentation site tracks the released version, not `main`, and that is a
# decision rather than a default. This site dogfoods the components it
# documents, so every page on it is a live demonstration of one particular build
# of the library — which makes the deployed site a claim about what the library
# does. A merge to `main` is not yet that claim: it is a change that has passed
# CI and is waiting for the release that decides whether it ships. Deploying it
# anyway would publish behaviour under a version number nobody can install.
#
# So there is no `push` trigger here. `release.yml` calls this workflow as a job
# gated on Release Please's `release_created`, which is true only on the run
# where a Release PR was merged, and never on the runs that opened or updated
# one. A contributor who needs to see `main` rendered runs `pnpm docs:dev`; a
# reader of this site gets the version the CHANGELOG describes.
#
# `workflow_call` rather than an `on: release` trigger, for the same GitHub rule
# `release.yml`'s own header explains: Release Please writes its tag and Release
# with the default `GITHUB_TOKEN`, and an event created with that token triggers
# no further workflow. An `on: release: published` deploy would sit here and
# never fire.

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Wrangler's deploy credential; see the `cloudflare` environment below.
        required: true
  # The manual lane, for redeploying the current release when the deploy failed
  # for a reason outside this repository — an expired token, a Cloudflare
  # outage — rather than for previewing unreleased work.
  workflow_dispatch:

# Never cancel a deploy in flight, and never share a group with the caller. The
# group is a literal rather than `${{ github.workflow }}` because a called
# workflow inherits the *caller's* name there: it would resolve to `Release`,
# the group `release.yml` is already holding, and this job would wait on a
# workflow that is waiting on it. Cancellation is off for the same reason the
# publish job's is — a half-uploaded site needs a human, and releases are rare
# enough that queueing costs nothing.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cloudflare offers no OIDC trusted publishing for Wrangler and no way to
    # mint a scoped token from CI, so this one credential is a stored secret —
    # the only one in the repository. The environment is what bounds it:
    # restricted to `main` in repository settings, so no fork and no feature
    # branch can reach the token, and every use is recorded against it.
    environment:
      name: cloudflare
      url: ${{ steps.site.outputs.url }}
    steps:
      # No `ref`, and that is already the released commit rather than a moving
      # branch tip: a called workflow reads the *caller's* event, so `github.sha`
      # here is the push Release Please tagged, not whatever `main` has become
      # since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Where the site lives is decided in `docs/.vitepress/base.ts`, which is
      # also what VitePress builds against and what the staging step checks the
      # Cloudflare route against. Read here rather than written again, so this
      # workflow cannot be the one place still naming the old path — both the
      # environment link above and the reachability check below use it.
      - name: Resolve the public URL
        id: site
        run: |
          set -euo pipefail
          node --input-type=module --eval \
            'import { BASE, SITE_URL } from "./docs/.vitepress/base.ts";
             console.log(`url=${SITE_URL}`);
             console.log(`base=${BASE}`);' >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      # Nests the build under the path it is served from, and fails if
      # `wrangler.jsonc`'s route disagrees with the base the site was just built
      # with — the one mismatch that deploys successfully and serves nothing.
      - run: pnpm docs:stage

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          # Off by default here rather than off by omission: Wrangler's telemetry
          # is on unless told otherwise, and a CI job is not a place to send
          # usage data nobody asked to send.
          CLOUDFLARE_TELEMETRY_DISABLED: "1"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # A deploy that reports success and a page a reader can open are not the
      # same claim. Routes, DNS and the asset prefix each fail silently — the
      # upload is green and the URL is a 404 or a wall of unstyled text — so the
      # site is fetched from outside Cloudflare's API before this job goes green.
      - name: Check the site actually serves
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
          SITE_BASE: ${{ steps.site.outputs.base }}
        run: |
          set -euo pipefail
          # Propagation is usually immediate and occasionally is not; five tries
          # at ten seconds is long enough to cover the difference and short
          # enough that a real breakage is reported rather than waited out.
          for attempt in 1 2 3 4 5; do
            if body=$(curl --fail --silent --show-error --location "$SITE_URL"); then
              # The asset prefix proves the staging step's nesting survived. A
              # 200 alone would pass on the unstyled-wall-of-text failure, which
              # is the one this whole path exists to prevent.
              printf '%s' "$body" | grep -qF "${SITE_BASE}assets/" \
                && { echo "Serving, with its assets rooted correctly."; exit 0; }
              echo "Served HTML carries no asset under the expected prefix." >&2
              exit 1
            fi
            echo "Attempt ${attempt} failed; retrying in 10s." >&2
            sleep 10
          done
          echo "The site did not answer after five attempts." >&2
          exit 1
