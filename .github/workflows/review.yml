name: Review

# Dogfood enrollment (ecoma-io/action-agents docs/dogfood.md @ v0.11.2, issue
# #261): review in its documented starting posture — dry-run, and no policy
# file, so the built-in defaults apply (strictness medium, strategy standard,
# language en, maxDiffLines 5000, no ignore). The rollout's first question —
# are the default reviewer's findings worth reading here? — is answered
# unconfounded by a local rubric. The flip to live is one line, after the
# first-run checklist has passed twice.
#
# No SARIF upload and no `security-events: write`: the Code Scanning surface
# is action-agents's own merge-enforcement story, and the targets start
# without it — the comment and the run artifact are the evidence. Adding it
# later means adding the upload step and that grant together, never either
# alone.
#
# A fork's pull request gets neither secret nor a write token, so the run
# fails at startup and writes nothing — the documented arrangement.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: read-all

concurrency:
  # A push sequence replaces the queued review instead of stacking reviews of
  # stale heads.
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A job-level block replaces the workflow-level one, so a job added later
    # inherits read-only instead of silently widening. This is one grant
    # narrower than the SARIF-carrying shape — see the header.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Unlike triage, review's subject IS the working tree. No credential is
      # left in a workspace the checkout fills with pull-request content —
      # under `pull_request` that content is untrusted input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - id: review
        uses: ecoma-io/action-agents/review@97f294f439ee9dd12f60a1a723469f6dcdf9c93f # v0.12.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: review
          dry-run: "true"

      # The exact file the run declared — set on green runs and on the red
      # boundary's record alike, and empty on terminals that declare none,
      # which the `if` covers both ways. The record directory is hidden, so
      # `include-hidden-files` is load-bearing.
      - name: Upload the run artifact
        if: always() && steps.review.outputs.artifact-file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-artifact
          path: ${{ steps.review.outputs.artifact-file }}
          include-hidden-files: true
          if-no-files-found: warn
