name: Harmonise

# Dogfood enrollment, multilingual README program (issue #370): the harmonise
# action keeping the README's eleven language twins in step with the English
# source, per the convention the README's protected badges and selector
# regions implement. Dry-run is the posture until the first proposal has been
# reviewed the way any contributor's pull request would be; the flip to a
# real run is a dispatch input, not an edit. The config lives at
# `.github/action-agents/harmonise/harmonise.json5` and is read through the
# API from the resolved policy source, so — unlike the reference workflow in
# the action-agents repository, whose checkout exists only to resolve
# `./harmonise` — this run needs no checkout at all. Until the config is on
# the default branch the action refuses at startup (its documented
# fail-loudly posture), which is the correct shape for a workflow landing
# alongside the change it serves.
#
# The pull request this action maintains must run CI like any contributor's:
# events raised by `GITHUB_TOKEN` are suppressed by GitHub's recursion
# prevention, so a harmonise PR opened on the workflow token would sit there
# with no checks at all. The App token minted below gives the run the
# organisation App's identity, and its events start workflows the way a
# contributor's do. That identity is stronger than the permissions block
# below — the block binds only `GITHUB_TOKEN` — the same trade `release.yml`
# makes for the Release PR, accepted because what a harmonise run may write
# is pinned in code: files inside the configured language patterns, one
# branch of its own naming, nothing else.

on:
  schedule:
    # Weekly, an hour after the semgrep analysis run — staggered, not stacked.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report drift and propose nothing.
        required: false
        default: "true"
        type: string

permissions: read-all

concurrency:
  # Two harmonise runs must never mutate the proposal branch at once; unlike
  # triage, cancelling in progress would abandon half-published proposals, so
  # queued runs wait instead of being cancelled.
  group: harmonise
  cancel-in-progress: false

jobs:
  harmonise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A job-level block replaces the workflow-level one, so a job added later
    # inherits read-only instead of silently widening. This is exactly what a
    # real run needs — blobs, a tree, a commit, its own branch ref, the one
    # pull request — and nothing more: no issues, no comments, no merges.
    permissions:
      contents: write
      pull-requests: write
    # Hoisted so the App-token step's `if:` has something it is allowed to
    # read — secrets cannot be referenced directly in step conditionals.
    # Same arrangement as `release.yml`, including the fallback: empty
    # credentials skip only this step, and the token line degrades to
    # `github.token` instead of failing red.
    env:
      HARMONISE_APP_ID: ${{ secrets.ECOMA_APP_ID }}
    steps:
      - name: Mint a GitHub App token
        id: app-token
        if: env.HARMONISE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ECOMA_APP_ID }}
          private-key: ${{ secrets.ECOMA_APP_KEY }}

      - uses: ecoma-io/action-agents/harmonise@2f0e18a8e1ea5bdfa8fc690057ca1bbdfaa4f3a4 # v0.12.1
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: harmonise
          source-language: en
          dry-run: ${{ inputs.dry-run || 'true' }}

      # The run record — outcome, pair accounting, pull request identity — as
      # a downloadable file. `always()` keeps the record for runs whose action
      # step failed; a run that died before any record could be written
      # produced no file. The record directory is hidden by design, so
      # `include-hidden-files: true` is load-bearing: upload-artifact prunes
      # hidden files by default and the glob then matches zero files while
      # the step still reports success. `if-no-files-found: warn` keeps a
      # declared write that lands nowhere loud instead of green over nothing.
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harmonise-run-record
          path: .harmonise-record/harmonise-record-*.json
          include-hidden-files: true
          if-no-files-found: warn
