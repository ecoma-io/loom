name: CI

on:
  # Every pull request, whatever it targets — deliberately unfiltered. A
  # `branches: [main]` filter here reads as "we only merge to main", which is
  # true, but what it actually does is skip CI on a pull request stacked on
  # another one: its base is a feature branch, so no run starts, and the change
  # is reviewed with no evidence at all until the branch below it merges and
  # GitHub retargets it. A pull request with no gate is the thing this file
  # exists to prevent, and where it happens to point is not a reason to allow it.
  pull_request:
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The affected step below diffs this branch against a base commit, so
          # that base and every commit since it must be available locally — a
          # shallow single-commit checkout cannot resolve the ref. Full history
          # is the price of not pulling every ref.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # `id` because the ESLint cache key below reads the version this
      # resolved to. `.node-version` pins the major only, so what that is
      # varies between runners.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .node-version
          cache: pnpm

      # `SECONDS` times the install: it is the fixed tax every job pays, and the
      # benchmark must separate it from the work it fronts before anyone
      # optimises one against the other.
      - name: Install dependencies
        run: >-
          SECONDS=0;
          pnpm install --frozen-lockfile;
          echo "install seconds=$SECONDS" >> "$GITHUB_STEP_SUMMARY"

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      #
      # Release Please's pull requests are held to this too, which took a
      # configuration change to make possible rather than an exemption here.
      # Its default title pattern is `chore${scope}: release${version}`, and it
      # fills `${scope}` with the *target branch* — so a Release PR arrived
      # titled `chore(main): release 0.1.0`, and `main` is not one of the areas
      # `scope-enum` names because it is not an area of the code at all. The
      # pattern is pinned scopeless in `release-please-config.json`. Worth
      # knowing because the failure is structural: it is not one bad title but
      # every Release PR this repository will ever open, and the tempting fix —
      # adding `main` to `scope-enum` — buys the merge by making the scope list
      # mean something other than what it means.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge — a type, a test, a bundle —
      # which is the entire reason the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      # ESLint's own cache, and the key is the whole of the thinking. ESLint
      # stores a hash beside each cached file, but what that hash covers is
      # narrower than it looks: its own version, Node's, and the parts of that
      # file's resolved configuration that survive JSON serialisation. Rule
      # names, severities and options do — a rule tightened in
      # `eslint.config.mjs` invalidates the entries it applies to. Rule
      # *implementations* do not, because functions do not serialise. Measured
      # against this repository's ESLint: with a plugin rule swapped for one
      # that reports where the old one did not, and nothing else changed, the
      # cached verdict replays and the run exits 0 on code the new rule
      # forbids — silently, since a cache hit prints nothing.
      #
      # So the key names, in order, everything an entry's own hash reacts to:
      #
      # - The resolved Node version, because ESLint hashes `process.version`
      #   into every entry. `.node-version` pins the major only, so the patch
      #   is whatever the runner resolved — two runs of *this* workflow, eight
      #   minutes apart, got 24.19.0 and 24.18.0. Without this the second run
      #   downloads a cache it then rejects entry by entry and re-lints
      #   everything anyway; with it, the miss is honest and the fresh cache
      #   is saved under a key that says which Node produced it.
      # - `pnpm-lock.yaml`, because every rule implementation arrives through
      #   it and a plugin bump is exactly the silent case above.
      # - `eslint.config.mjs`, because the parser and plugin objects it wires
      #   up are the other half that does not serialise, and because a reader
      #   editing rules should not have to know which parts of this file the
      #   per-entry hash happens to cover.
      #
      # `github.sha` on the end, with everything before it as `restore-keys`:
      # a key that hits exactly is never written back, so a fixed key would
      # freeze the cache at the first commit that built it and cover fewer
      # files with every merge after. Restoring by prefix cannot cross any of
      # the three above, because the prefix holds all of them.
      #
      # After `pnpm install`, because the cache lives under `node_modules/` —
      # where Git, Prettier and ESLint already ignore it, which is what keeps
      # it out of a commit.
      - name: Cache ESLint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-

      # Type-aware, so a verdict here depends on files this branch never
      # touched: a signature another queued pull request changed can turn a call
      # site in this one into an unsafe-argument error that neither branch shows
      # alone. That interference is exactly what the queue re-runs to catch.
      #
      # `--cache-strategy content` inside the script, and it is what makes the
      # cache above worth restoring at all: the default keys each entry on size
      # and mtime, and a fresh checkout writes a new mtime on every file — a
      # perfectly restored metadata cache would then miss on all of it.
      #
      # That cache is why lint still runs moon-side for every affected project:
      # moon gives lint a restore-able hash key of its own, but dropping the
      # shared ESLint cache would re-lint every file of every affected project
      # on the first affected run after a base change.
      #
      # Otherwise the lint step here is retired: moon now owns lint, typecheck
      # and the published build, running each on this branch's affected projects
      # only. The three root scripts it replaces ran everything, every time.
      - name: Resolve affected base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        # `moon ci` supports --base / --head and diffs this branch against the
        # base ref to select affected projects. On a pull request the base is
        # the merge commit it will land on; in the merge queue it is the
        # batch's own base (`merge_group.base_sha`), so the diff covers every
        # queued change rather than one merge commit; on a push to main it is
        # the commit this one grew from. On the very first commit (a
        # repository seed, or a
        # base that predates the checkout depth) `before` is the all-zero SHA,
        # which would diff against a commit that does not exist — so fall back
        # to the parent commit. Everything arrives via the environment, never
        # via `${{ }}` interpolation, so a branch name cannot run shell.
        run: |
          if [ "$PR_BASE" != "" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ "$MG_BASE" != "" ]; then
            echo "base=$MG_BASE" >> "$GITHUB_OUTPUT"
          elif [ "${PUSH_BEFORE//0/}" != "" ]; then
            echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # `pnpm lint` also ran `tools/check-component-artifacts.ts` — the
      # five-artifacts-per-component gate — which has no moon task. It is
      # hoisted out of the lint script into its own step so a component's
      # artifacts are checked on every run, not just the local one. The same
      # goes for `tools/check-architecture.ts`, which keeps the Moon dependency
      # graph, the facade-import boundary and the component-E2E ownership rules
      # mechanically enforced rather than review-recalled.
      - name: Check component artifacts
        run: node tools/check-component-artifacts.ts

      - name: Check architecture
        run: node --experimental-strip-types tools/check-architecture.ts

      # The third architecture gate, and the one that judges resolved imports
      # rather than specifier text. `archkeep check` reads the Moon project
      # graph, resolves every `.ts`/`.vue` specifier through
      # `tsconfig.base.json`, and judges the resolved target against
      # `module-boundaries.config.mjs`. It is deliberately NOT a moon task and
      # deliberately not cached: the verdict is a statement about the whole
      # tree at once (the cycle rule cannot be answered from one project), and
      # an architecture green replayed from a cache is the one result this
      # repository must never publish.
      #
      # Exit 1 and exit 3 both fail the step, which is the contract: 1 is a
      # boundary crossed, 3 is a checker that could not reach a verdict, and
      # collapsing the second into success would turn an outage into a green
      # build.
      - name: Check module boundaries
        run: pnpm archkeep:check

      # And the proof that the step above can fail at all. A constraint row
      # whose tag no project carries, a `paths` alias that stopped resolving, a
      # project that lost its tag — each reads as a clean run, and
      # `module-boundaries.config.mjs` is a file a pull request can edit. The
      # harness breaks the architecture seventeen ways against the real tree,
      # asserts the violation each one was written to produce, and restores
      # every file byte for byte. Unconditional on purpose: a gate on the gate
      # that runs only when someone remembered to change the right file is a
      # gate nobody notices has stopped running.
      - name: Prove the boundary gate fails on a broken architecture
        run: pnpm archkeep:mutations

      # Moon's own task cache, and what it adds to `runInCI: affected` is the
      # other half of the same idea: selection decides which tasks a run
      # *starts*, the cache decides which of those it has to actually execute.
      # Without a restored `.moon/cache` every run starts cold, so a pull
      # request that pushes a second commit re-runs every task the
      # diff-against-base still selects — including the projects that second
      # commit never touched. Measured on this repository at the
      # architecture-baseline commit, where the diff selects everything: the
      # cold `moon ci --base` run executed 189 tasks in 6m 17s, and the
      # identical run against a preserved cache replayed all 189 in 1.3s. The
      # cache that bought it is 4.6 MB.
      #
      # The three cached directories are moon's run state, and nothing else
      # in `.moon/cache/` is (measured on 2.4.6): replay is decided by
      # `states/<project>/<task>/lastRun.json`, which carries one hash and exit
      # code per task, `outputs/` holds the tarred task outputs it hydrates,
      # and `hashes/` the input manifests. `hashes/` looks droppable — replay
      # stays correct without it — and is not: deleted, one project's cached
      # test replayed in 12.6s instead of 0.6s, because moon re-derives every
      # manifest it cannot find. `states/` travels whole, workspace-graph
      # snapshots included, because moon rebuilds those off the configs rather
      # than trusting what it restored — dropping a project from
      # `.moon/workspace.yml` against a warm cache moved the query from 93
      # projects to 92, so a restored graph cannot outlive the config it
      # describes.
      #
      # Left out deliberately: `ciReport.json` and `runReport.json`, because
      # `tools/ci-benchmark.ts` reads the report the run it follows just wrote,
      # and a report restored from another commit would be published as this
      # run's timings; `locks/`, which is live process state; and `schemas/`,
      # which moon regenerates for nothing.
      #
      # Key discipline is the ESLint cache's above, and for the same reason:
      # `github.sha` last so a key that hits exactly is still written back under
      # a new one — a fixed key freezes the cache at the first commit that built
      # it — with the sha dropped in `restore-keys` so a branch inherits the
      # newest cache `main`, or its own previous push, left behind. The lockfile
      # sits in the prefix because it is a declared input of every test and lint
      # task: a bump invalidates every hash in the cache, and restoring one only
      # to reject it entry by entry is download time bought for nothing.
      #
      # The resolved Node version is *not* in this key, unlike ESLint's, and the
      # asymmetry is moon's: its hash manifest records the toolchain as `system`
      # with no version beside it, so nothing here is rejected on a patch
      # difference — naming it would only shatter the cache along the
      # runner-to-runner patch drift the ESLint comment measured, which is
      # frequent enough to make almost every restore a miss. The price is that a
      # green proved under one Node patch can replay under another.
      #
      # Combined, not the split restore/save the docs-dist and browser caches
      # use, and the difference is what a failure leaves behind. Those two cache
      # an *artifact* a dying step can leave half-written. Moon caches a
      # verdict, and never a bad one: a failing task records `exitCode: 1` and
      # re-runs on the next invocation rather than replaying (measured — two
      # consecutive runs at an identical hash both executed the task). So the
      # post-step save is the right shape here, because it also runs when a
      # later step failed: a job that dies in typecheck still banks the tests
      # moon proved before it.
      #
      # One exposure this widens, and it is the boundary `.moon/tasks/test.yml`
      # already names: moon hashes a task's own files and its *direct*
      # dependencies' sources, not the transitive closure. In a cold run that
      # gap is covered by selection — `--downstream deep` picks the whole
      # closure and every project in it runs fresh, having never run in that
      # job. Against a restored cache a dependent whose own hash is unchanged
      # replays instead — observed here: a one-line edit to
      # `packages/core/src/cn.ts` re-ran 83 of the 189 tasks and replayed
      # `loading-state:test`, whose declared deps are skeleton and spinner. So a
      # transitive-only source edit can now carry a stale green *across* runs,
      # which a cold run could not do at all. The backstop is the push to main
      # below: it runs the uncached `pnpm test` over every test file, so that
      # green is re-proved from cold on the commit that ships. The merge queue
      # runs every project too, but through `moon run :test` against this same
      # cache, so it replays rather than re-proving — deliberately, and the
      # step there says why.
      - name: Cache moon task results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
            .moon/cache/states
          key: moon-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            moon-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Moon's toolchain tree, and it is a different cache from the one above:
      # that one carries what moon *concluded*, this one carries what moon
      # *runs on*. Every moon invocation that runs a task resolves the versions
      # `.moon/toolchains.yml` pins and installs the missing ones under
      # `~/.proto`, regardless of what `pnpm/action-setup` and `setup-node`
      # already put on PATH — the runner has node and pnpm, and moon fetches
      # its own anyway. Measured on 2.4.6 against a wiped `~/.proto`: 12s 201ms
      # of setup actions before the first task starts (proto 0.58.2 in 4s
      # 617ms, node 24.19.0 in 6s 322ms, pnpm 11.20.0 in 1s 261ms), and 50ms
      # for the same four actions to skip against a restored tree. In CI it was
      # visible as the ~9s of bootstrap inside an 8.8s `moon run docs:build`
      # step that had no build left to do.
      #
      # `~/.proto/cache` is deliberately not one of the paths. It is proto's
      # HTTP request cache — the archives it has already unpacked — and it is
      # 51 MB of the tree, a third of the compressed size, for nothing:
      # deleted, the four setup actions still skip in 36ms. What travels is
      # 299 MB on disk and ~91 MB compressed, 3.4s to unpack locally.
      # `~/.moon/plugins` goes with it because moon fetches its own toolchain
      # WASM plugins (8.9 MB) separately from anything proto installs.
      #
      # Exact key — no `github.sha`, no `restore-keys` — which is the opposite
      # of every other cache in this file, and the reason is that this one has
      # nothing to advance. ESLint's, moon's task cache and the tsbuildinfo
      # accumulate, so a key that hits and is never written back freezes them at
      # the commit that built them. A toolchain tree is a pure function of the
      # versions pinned in `.moon/toolchains.yml` and of the moon CLI that reads
      # them — the proto version is moon's own choice, 2.4.6 installs 0.58.2 —
      # so a run that hits has nothing to add, and the bootstrap is paid exactly
      # when one of those two moves.
      #
      # Both are in the key. `pnpm-lock.yaml` is how the moon CLI arrives, and
      # it is coarser than the thing it stands for: a dependency bump that
      # changes nothing about the toolchain still pays one bootstrap and one
      # re-upload. That is the honest side of the trade, and the other side is
      # worse — a narrower key would leave a moon bump restoring a tree without
      # the proto the new version wants, re-installing it on every run
      # afterwards with no key change to ever end it. `.node-version` is not in
      # the key and does not belong there: pointed at 22.18.0 with
      # `.moon/toolchains.yml` untouched, moon still resolved node 24.19.0.
      #
      # `restore-keys` is left off for the same reason the sha is. A prefix
      # restore would hand a bumped run the previous versions' tree, which is
      # not wrong — moon installs what is missing beside it — but the tree saved
      # under the new key would carry both versions, and one more with every
      # bump after that, with nothing that ever removes one.
      - name: Restore moon's toolchain
        id: moon-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/tools
            ~/.proto/plugins
            ~/.proto/shims
            ~/.proto/bin
            ~/.moon/plugins
          key: moon-toolchain-${{ runner.os }}-${{ hashFiles('.moon/toolchains.yml', 'pnpm-lock.yaml') }}

      # `MOON_CONCURRENCY` bounds Moon's task pool. Without it Moon defaults
      # to the host CPU count and launches that many concurrent vitest forks
      # (each `maxWorkers: 1` by the root config) — on a 16-core runner that is
      # 16 jsdom suites at once, spiking the box. The `pnpm moon` wrapper
      # defaults it to 4; this step calls bare `pnpm exec moon`, so the cap is
      # set explicitly here to match.
      - name: Moon affected lint, build and tests
        env:
          MOON_CONCURRENCY: "4"
        run: pnpm exec moon ci --base "${{ steps.base.outputs.base }}"

      # Split restore/save rather than the combined `actions/cache` the two
      # caches above use, and it is proto's mechanism that decides it rather
      # than symmetry with the docs-dist and browser caches: proto validates an
      # install by its manifest, never by the tree. Measured — with
      # `~/.proto/tools/node/24.19.0/bin/node` truncated to 1000 bytes and
      # `manifest.json` left alone, `moon setup` reports "All toolchains are
      # already up to date" and the next uncached task dies with `Process eslint
      # failed: unknown failure`. Nothing downstream ever re-checks it. The
      # combined action saves in a post step that runs even when a step died
      # mid-install, and because this key never advances, a tree banked in that
      # state would not be one commit's problem: every run on these pinned
      # versions would restore it until someone edited `.moon/toolchains.yml`.
      # As an ordinary step, the save does not run after a failure at all.
      #
      # The price of that shape, plainly: a `moon ci` that fails on a genuine
      # test failure leaves a working toolchain unbanked, and the next run
      # installs it again. Guarded on the restore's miss as well, so a run that
      # hit the key does not upload 91 MB to overwrite it with itself.
      - name: Save moon's toolchain
        if: steps.moon-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/tools
            ~/.proto/plugins
            ~/.proto/shims
            ~/.proto/bin
            ~/.moon/plugins
          key: moon-toolchain-${{ runner.os }}-${{ hashFiles('.moon/toolchains.yml', 'pnpm-lock.yaml') }}

      # The benchmark digest: moon just wrote ciReport.json with per-action
      # durations and cache hits. `tools/ci-benchmark.ts` reads it (no re-run)
      # and appends a table — run-task count, cached count, sum of run-task
      # seconds, and the moon cache savings estimate — to the step summary, so
      # how much of this change's test/lint cost was cache-replayed is visible
      # in the run rather than buried in a 263 KiB JSON report. GitHub injects
      # GITHUB_STEP_SUMMARY into every step's environment, so the tool needs no
      # wiring beyond running it.
      - name: Report moon run timing
        run: node --experimental-strip-types tools/ci-benchmark.ts

      # `moon ci` selects tasks whose own inputs changed — the dependents' tests
      # do not run. A button edit proves button's 8 tests but not
      # alert-dialog's, whose suite mounts the very button that changed. Moon's
      # runner does not walk the graph downstream (measured on moon 2.4.6:
      # `moon ci --downstream deep` still resolves only the directly-changed
      # targets), but its *query* does — so the closure is moon's own answer,
      # and this step only feeds it back as explicit targets. The projects moon
      # ci just ran are cache no-ops; fresh tests run only for the dependents.
      #
      # An empty closure is a legitimate outcome, not an error: a release PR
      # or a root-file edit touches files no project owns, and the right run
      # is no run.
      - name: Affected unit-test closure (dependents)
        env:
          MOON_BASE: ${{ steps.base.outputs.base }}
          # The `moon run` below is a task pipeline with its own concurrency
          # pool — same cap as the `moon ci` step above, for the same reason.
          MOON_CONCURRENCY: "4"
        # pipefail, because the default shell is only `bash -e`: with a plain
        # pipe, a crashed `moon query` hands jq an empty stream, jq exits 0,
        # and the whole dependents' coverage would vanish green.
        run: |
          set -o pipefail
          ids=$(pnpm exec moon query projects --affected --downstream deep | jq -r '.projects[].id')
          if [ -z "$ids" ]; then
            echo "no affected projects — nothing downstream to test"
            exit 0
          fi
          # Word-splitting is deliberate: one id per target.
          # shellcheck disable=SC2046
          pnpm exec moon run $(printf '%s:test ' $ids)

      # The type-check is a repository-wide verdict, run once. There is no
      # per-project moon typecheck task on purpose: every package resolves the
      # root tsconfig's whole-repo include, so a per-project vue-tsc is either
      # a multi-pass re-check of the same files (which once pushed verify past
      # its timeout) or a coverage hole. One global pass is the honest shape —
      # a GLOBAL VALIDATION BOUNDARY, not an affected task pretending
      # otherwise.
      #
      # Measured at this version pairing (vue-tsc 3.3.9, TypeScript 5.9.3): a
      # cold pass is 17-19s, which was the largest single estimated step in
      # verify with no number attached to it. `--incremental` needed no
      # `tsconfig.json` change — the CLI flags alone write a ~190 KB
      # `.tsbuildinfo` beside `node_modules` — and a warm run against a
      # restored one is 6-7s, 11s after a real component edit. Touching every
      # one of the 399 source files' mtimes (what a fresh checkout does to all
      # of them) still warmed to 5s: TypeScript 5.x validates a buildinfo by
      # content and signature, not mtime, so the cache below survives the
      # exact thing a fresh CI checkout does to a tree. Correctness held warm
      # too: a single-file error was reported, and a signature break in
      # `cn()` (`packages/core`) surfaced as 202 errors across consumer `.vue`
      # files in the same warm run — a whole-repo program is what let that
      # break surface at all, which is the reason this stays one program
      # rather than one per package. Sharding this cache by package would
      # shard the very check that caught it.
      - name: Cache TypeScript incremental state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/typecheck.tsbuildinfo
          key: typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-

      # Key discipline matches the ESLint and moon caches above: `runner.os`,
      # then everything the check's own inputs, then `github.sha` last with
      # the sha dropped in `restore-keys` — a key that hits exactly is still
      # written back under a new one, so a branch inherits the newest cache
      # `main` or its own previous push left behind rather than freezing at
      # the commit that built it. `tsconfig.json` joins the lockfile in the
      # prefix because either can change what gets checked without the other
      # moving.
      #
      # No Node version in the key, unlike ESLint's cache directly above:
      # ESLint hashes `process.version` into every cached entry, but a
      # `.tsbuildinfo` records the TypeScript version and the program's file
      # signatures, not the Node that ran it — and TypeScript is already
      # pinned through `pnpm-lock.yaml`, which is in this key. Naming the
      # resolved Node patch here would only shatter the cache along drift
      # that has nothing to do with what the buildinfo actually validates.
      #
      # Combined, not the split restore/save the docs-dist and browser caches
      # use. Those cache a *build artifact* a dying step can leave
      # half-written and then have a later run serve as if it were whole. A
      # `.tsbuildinfo` has no such failure mode: vue-tsc validates it by
      # content before trusting it, and an unreadable or invalid file falls
      # back to a cold pass rather than a wrong verdict — so the worst a
      # partially-written file left by a dying job can cost the next run is
      # the 17-19s this cache exists to avoid, never a stale green.
      - name: Global typecheck
        run: >-
          SECONDS=0;
          pnpm typecheck;
          echo "typecheck seconds=$SECONDS" >> "$GITHUB_STEP_SUMMARY"

      # The whole-repo unit suite has moved off the pull-request path: `moon ci`
      # above already runs the affected projects' tests, with cross-component
      # imports now real moon deps (see tools/sync-moon-deps.ts), so a component
      # change proves its own tree's tests rather than all ~90 projects'. Vitest
      # re-runs those same files again here on every PR — that was the fixed
      # ~204s global suite the Phase 2 brief removed.
      #
      # What remains is gated where it is the *reason for existing*, and the two
      # events want different things from it.
      #
      # The merge queue runs checks against `main + every PR ahead + this one`,
      # which is the only place two independently-green pull requests can turn
      # out to have conflicting unit expectations. That question is about the
      # batch's own diff, and it does not need the suite executed from cold to
      # answer: `moon run :test` selects *every* project (93 of them, all
      # carrying the inherited test task — `:test` alone is the all-projects
      # form on moon 2.4.6, no target list to derive), and with the cross-run
      # cache restored above every task whose hash is unchanged replays while
      # the ones the batch invalidated run fresh. The declared inputs
      # (.moon/tasks/test.yml) are what "invalidated" means: a task's own files,
      # its *direct* dependencies' `src/**` and `package.json`, and the
      # lockfile. Measured here at 93 projects: cold 1m 59s, an unchanged
      # re-run replayed all 93 in 0.9s, and a one-line edit to
      # `packages/primitives/button/src/Button.vue` ran 5 fresh — button plus
      # the four projects that declare it — and replayed 88.
      #
      # Latency is why, and it is the queue's alone: the queue is serial, so
      # every second here is a second every pull request behind this one waits.
      # `pnpm test` is one vitest process at `maxWorkers: 1` (a jsdom-per-file
      # constraint, see vite.config.ts), so its cost is linear in the component
      # count and grows with every component this library adds — on a critical
      # path whose whole job is to answer a question about one diff. Same
      # machine, same tree: `pnpm test` 3m 55s against the numbers above, and
      # the gap widens with every component, because one side of it is a
      # function of the batch's diff and the other is a function of the
      # repository's size.
      #
      # The transitive-only case is the one this does not close, and it is the
      # KNOWN CACHE BOUNDARY `.moon/tasks/test.yml` names rather than a new
      # exposure: a dependent two hops from the edit has an unchanged hash and
      # replays. Which is exactly why the step below is not the same command.
      #
      # This step's own replay split does not reach the benchmark digest, and
      # saying so beats letting a reader infer it: `moon run` writes
      # `runReport.json`, `tools/ci-benchmark.ts` prefers `ciReport.json`, and
      # `moon ci` above already wrote one — so the digest below reports the
      # affected pipeline's numbers, not this run's. `moon run` prints its own
      # `Tasks: N completed (M cached)` line in the log, which is the number
      # this step is judged on.
      - name: Full repository unit suite (merge queue)
        if: github.event_name == 'merge_group'
        env:
          # Same cap, same reason as the moon steps above: uncapped, moon
          # launches one vitest fork per core and 16 concurrent jsdom suites
          # spike the runner.
          MOON_CONCURRENCY: "4"
        run: pnpm exec moon run :test

      # A push to main is the commit that ships, and this is the one run that
      # trusts no cache: `pnpm test` is a single uncached vitest program over
      # every test file, so the transitive-only stale green the step above can
      # replay — and any other verdict a restored `.moon/cache` carried across
      # runs — is re-proved from cold on every commit that lands. It is also
      # the only place the repository-wide coverage thresholds are enforced:
      # the moon task runs `--no-coverage` per project on purpose (those
      # thresholds are a whole-repo contract, see .moon/tasks/test.yml), so
      # this step is the gate for them too.
      #
      # It stays deliberately uncached. The merge-queue step is allowed to be
      # fast because something behind it is not, and that something is here —
      # replacing this with a cached run would leave the boundary with no
      # backstop at all, on the commit where a stale green is most expensive.
      #
      # `workflow_dispatch` is named rather than left to fall out of a
      # negation: the condition this replaced was `!= 'pull_request'`, so a
      # manual run got the full suite, and splitting the step on `== 'push'`
      # alone would have quietly retired that — a dispatch is how someone asks
      # for the uncached answer by hand.
      - name: Full repository unit suite (push to main)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm test

      # The route, and not the build. A page that fails to build is still
      # caught before the merge — any run whose plan needs the built site
      # builds it once in `e2e-build-docs`, and `moon ci` above builds it when
      # `docs/` itself changed, so building it again here re-proved what those
      # had proved. What no step does is run `docs:stage`: nothing else before a
      # merge compares the Cloudflare route against the base the site is built
      # with, and that mismatch deploys successfully and serves nothing.
      #
      # `--check` is the half of that script that needs no build — it reads
      # `wrangler.jsonc` and `docs/.vitepress/base.ts` and compares them. The
      # copy half stays in `docs.yml`, which builds the site itself before
      # deploying it. Dropping the build without that seam would leave a check
      # that passes and then fails copying a directory nobody made.
      - run: pnpm docs:check-route

      # The verify-job benchmark digest: step durations are GitHub's own, and
      # moon's report carries the task-level numbers. This block re-prints the
      # moon digest (it is the only long phase whose internal cost is otherwise
      # invisible) so the run's step summary carries both the wall-clock and the
      # cache-replay split in one place. See tools/ci-benchmark.ts for what it
      # reads and why it runs nothing.
      - name: Verify benchmark digest
        if: always()
        run: node --experimental-strip-types tools/ci-benchmark.ts

  # One discovery step replaces the fixed 3-browser × 8-shard matrix. `e2e-plan`
  # classifies what actually changed (see tools/e2e-plan.ts) and emits the exact
  # set of browser workloads the run needs: a docs-only change runs the axe
  # sweep at `standard`, a component change with own specs runs only the affected
  # components' specs through the harness at `smoke`, a spec-less component
  # change at PR level runs no browser legs (semantic evidence from browserless
  # tier, contrast pairs from theme-core, rendering-dependent sweep as push
  # backstop), a theme change runs both the sweep and the theme-sensitive
  # components, a dependency bump (lockfile) runs the sweep the graph cannot scope,
  # and a no-op (nothing relevant changed) emits an empty `include` — `e2e-run`
  # expands to zero legs and passes. Discovery reads moon's affected answer and
  # applies policy; it decides nothing the graph already decides.
  #
  # The base is the same one `verify` resolves: on a pull request it is the
  # merge commit this branch will land on, on a push to main the commit it grew
  # from, and the `HEAD~1 || HEAD` fallback covers the very first commit.
  e2e-discover:
    name: E2E discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-root: ${{ steps.plan.outputs.has-root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `e2e-plan` diffs the branch against the base, so that base and every
          # commit since it must be present locally — the same full-history price
          # `verify` pays.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # `tools/e2e-plan.ts` resolves the affected set by shelling out to
      # `moon` (`pnpm exec moon query projects --affected`), which resolves
      # through `node_modules/` — so the install is required and deliberate,
      # not skipped.
      - run: pnpm install --frozen-lockfile

      - name: Resolve affected base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$PR_BASE" != "" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ "$MG_BASE" != "" ]; then
            echo "base=$MG_BASE" >> "$GITHUB_OUTPUT"
          elif [ "${PUSH_BEFORE//0/}" != "" ]; then
            echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # No moon toolchain cache in this job, unlike `verify` and
      # `e2e-build-docs`, and the measurement is the whole argument: `moon
      # query` reads the project graph and runs no task, so it installs neither
      # proto, node nor pnpm. Measured on 2.4.6 against a wiped `~/.proto` —
      # `moon query projects --affected` left `~/.proto` empty and cost 4.1s
      # against a warm 1.4s, and the entire difference is the 8.9 MB of
      # toolchain WASM plugins it fetches into `~/.moon`. Restoring the ~91 MB
      # tree the other two jobs cache, to buy 2.7s of that, costs more than it
      # returns.
      #
      # `e2e-plan` resolves the affected set against the base itself; the step
      # above only supplies that base. The tool prints the full report (scenario,
      # changed count, affected ids and the rows); the matrix consumes only the
      # `include` array, so the diagnostic fields never leak into a leg —
      # `has-root` additionally tells the build job below whether any leg will
      # need the built docs site.
      - name: Compute the E2E matrix
        id: plan
        env:
          MOON_BASE: ${{ steps.base.outputs.base }}
        # Assignments before the writes: `echo "x=$(jq …)"` would swallow a
        # failing jq inside the substitution, and the step would publish an
        # empty output as if the plan were empty.
        run: |
          node --experimental-strip-types tools/e2e-plan.ts --print > matrix.json
          matrix=$(jq -c '.include' matrix.json)
          has_root=$(jq -r '.hasRoot' matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has-root=$has_root" >> "$GITHUB_OUTPUT"

  # The docs site is built once per run, not once per leg. Every root-suite leg
  # drives the same built site; before this job existed each leg rebuilt it
  # inside Playwright's webServer — identical work, measured at ~75 seconds,
  # repeated up to two dozen times. The built site travels through the actions
  # cache keyed on the exact commit (the same pinned action the ESLint cache
  # uses, so no new third-party action enters the workflow); legs restore it
  # with fail-on-cache-miss so a silently missing build turns the leg red
  # rather than quietly rebuilding.
  e2e-build-docs:
    name: Build docs for E2E
    runs-on: ubuntu-latest
    needs: e2e-discover
    if: needs.e2e-discover.outputs.has-root == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Arrived with the moon step below, not before it: `moon run` queries
          # changed files whenever it runs under CI — even for an explicit
          # target that needs no affected check — and resolves them against
          # `vcs.defaultBranch`, which is `main` (.moon/workspace.yml). The
          # default depth-1 checkout fetches only the ref being built, so `main`
          # is present in no form at all and moon exits before the first task:
          # `Process git failed: exit code 128 — fatal: ambiguous argument
          # 'main'`. Invoking `vitepress` directly, as this job used to, never
          # touched git, which is why the job ran for months without history.
          #
          # It is the ref this buys and not the depth, which is worth recording
          # because the two look interchangeable and are not: reproduced in a
          # clone with *full* history and `refs/remotes/origin/main` deleted,
          # moon fails identically. Moon resolves `main` through that
          # remote-tracking ref, even though `git rev-parse main` on the same
          # checkout still reports the ambiguous-argument error — so a targeted
          # `git fetch origin main` would be a smaller change built on a guess
          # about which name moon looks up. This is the same full-history price
          # `verify` and `e2e-discover` already pay, for a different reason.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Restore and save are split deliberately, not spelled with the combined
      # `actions/cache`: the combined action saves in a post step that runs
      # even when the build failed, and VitePress leaves a partial dist behind
      # — a broken site frozen under this commit's immutable key, which every
      # re-run would then restore and test. As an ordinary step, the explicit
      # save simply never runs after a failure.
      - name: Restore an already-built site
        id: docs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ github.sha }}

      # Moon's task cache, restored and never saved here, so a site whose real
      # inputs have not moved is hydrated out of `.moon/cache/outputs` instead
      # of rebuilt. `docs:build` declares `.vitepress/dist` as its outputs and
      # the library, the docs tree and the lockfile as its inputs (see
      # docs/moon.yml for why each is there and what a missing one would
      # replay), so the hash this restores against is a fact about the site's
      # sources rather than about the commit. Measured locally: 25.8s to build
      # cold, 1.2s to replay — and the replay was measured with the dist
      # deleted first, so that 1.2s includes hydrating all 16 MB of it back out
      # of a 3.0 MB archive.
      #
      # Restore-only, deliberately. `verify` already saves this exact key family
      # from its combined cache, and it saves the whole run's state; this job
      # would have one task's to offer under the same key. A second save is not
      # harmless in that shape — whichever job reserved the key first wins and
      # the other's is dropped, so on the runs where this job won, a rich cache
      # would be replaced by a one-task one for every job that restores it next.
      # What banks this build is therefore `verify`'s `moon ci`, which now
      # selects `docs:build` whenever the library or the docs tree changed —
      # which is a superset of the changes that make this job run at all. The
      # two jobs start together, so what this restores is the previous push's or
      # `main`'s, never this run's `verify`; an infra-only pull request (no
      # docs, no packages) is where that pays best, replaying a site `main`
      # built.
      #
      # Skipped when the site was already restored above, because then there is
      # nothing to hydrate and the moon cache would be a download bought for a
      # step that does not run.
      - name: Restore moon task results
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
            .moon/cache/states
          key: moon-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            moon-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Moon's toolchain tree, restored so that the `moon run` below does not
      # spend 12s installing proto, node and pnpm onto a runner that already has
      # node and pnpm from the two setup actions above. This job is where that
      # cost was first measured: ~9s of an 8.8s `moon run docs:build` step whose
      # build was replayed out of the cache restored directly above. See
      # `verify` for what the paths hold, why `~/.proto/cache` is not among them
      # and why the key is exact.
      #
      # Restore-only, for the reason the moon task cache above it is: `verify`
      # saves this key family, and the two jobs start together, so what this
      # restores is `main`'s or the previous push's. The reason differs from
      # that one's, though, and the difference is worth stating because the
      # steps look identical — a task cache saved from here would be a
      # *downgrade* for everything that restored it next, one task's state
      # replacing a whole run's, whereas a toolchain tree is the same tree
      # whoever writes it. This is left restore-only only because a second
      # writer on an exact key buys nothing but a race with `verify`, which runs
      # on every event that runs this job.
      #
      # Skipped on a docs-dist hit, exactly like the cache above: the build step
      # is skipped too, and a moon invocation that never happens is 91 MB
      # downloaded for nothing.
      - name: Restore moon's toolchain
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.proto/tools
            ~/.proto/plugins
            ~/.proto/shims
            ~/.proto/bin
            ~/.moon/plugins
          key: moon-toolchain-${{ runner.os }}-${{ hashFiles('.moon/toolchains.yml', 'pnpm-lock.yaml') }}

      # Skip-if-restored stays, and it is now the narrower of two fast paths
      # rather than the only one: moon replays a site built at these inputs
      # under any commit, this skips one built under *this* commit. It survives
      # because the restore step above it has to exist anyway — the save below
      # is guarded on its outcome, since `docs-dist-<sha>` is immutable and a
      # second save under a key that already holds this commit's site is a
      # reservation failure — and because re-hydrating 16 MB over a dist that is
      # already correct buys nothing.
      #
      # `MOON_CONCURRENCY` for the same reason `verify` sets it: the `pnpm moon`
      # wrapper defaults it to 4 and this is a bare `pnpm exec moon`, so a
      # future task with dependencies does not silently inherit the host CPU
      # count here.
      - name: Build the docs site
        if: steps.docs-cache.outputs.cache-hit != 'true'
        env:
          MOON_CONCURRENCY: "4"
        run: pnpm exec moon run docs:build

      - name: Save the built site
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ github.sha }}

  e2e-run:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The official Playwright image: browsers and their system dependencies are
    # preinstalled, so no leg ever runs `playwright install --with-deps` — the
    # step that starved under concurrency before (measured 2026-08: 12 of 26
    # pw-infra legs hit the 20-minute ceiling on the apt half, and 2026-08-26 a
    # WebKit leg burned its whole 20 minutes in apt before being cancelled).
    # The tag must equal the `@playwright/test` version the lockfile resolves:
    # browsers are built per Playwright revision, and a mismatch fails on
    # "Executable doesn't exist". Bump the lockfile, bump this tag, in one
    # commit.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        # The runner overrides HOME to /github/home, a host mount whose owner
        # is not this container's root user — and Firefox refuses to launch
        # unless $HOME belongs to the current user. Pointing HOME back at the
        # image's own /root is the workaround Firefox's own error guidance
        # names. Chromium and WebKit do not make this check.
        HOME: /root
    # `e2e-build-docs` is skipped when no leg needs the built site, and a
    # skipped need normally skips the dependent job too — the `!cancelled()`
    # form runs the legs in that case while still failing them if the build
    # genuinely failed. The `!= '[]'` guard makes the noop case (an empty
    # plan) an explicit skip rather than leaning on how GitHub happens to
    # treat an empty `include`.
    needs: [e2e-discover, e2e-build-docs]
    if: ${{ !cancelled() && needs.e2e-discover.result == 'success' && needs.e2e-discover.outputs.matrix != '[]' && (needs.e2e-build-docs.result == 'success' || needs.e2e-build-docs.result == 'skipped') }}
    # Sized for the slowest quarter-suite: post-#122 WCAG gate split, a 4-shard
    # leg runs ~11 minutes of tests on the worst engine (Firefox, ~10.9m measured
    # down from ~12.2m pre-split) plus ~2 of setup, with headroom for
    # Playwright's two CI retries with traces on a genuinely failing shard.
    timeout-minutes: 20
    strategy:
      # One battery failing in engine A must not hose the other engines' answer
      # to "is the break engine-specific?" — the question the browser spread
      # exists to answer.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The container user never matches the workspace mount's owner, so git
      # refuses the repository ("dubious ownership") when the `prepare`
      # script's `lefthook install` asks git about it — measured 2026-08-26,
      # every leg of this job's first container run died there. checkout sets
      # its own safe.directory under a throwaway HOME that does not outlive
      # the step; this one persists for pnpm install and everything after.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: pnpm install --frozen-lockfile

      # No browser install, no browser cache: the job container above ships
      # every engine and its system dependencies preinstalled. This replaces
      # the restore/install/save trio this job carried for the apt starvation
      # (measured 12 of 26 pw-infra legs at the 20-minute ceiling, and a WebKit
      # leg cancelled 2026-08-26 after spending its whole budget in apt); with
      # the engines in the image, `pnpm install` is the only per-leg setup
      # that remains, and it cannot starve the way apt did.

      # actions/cache compresses entries with zstd (the build job's save runs
      # `tar --use-compress-program zstdmt`), and the Playwright image does
      # not ship the zstd binary — the first container run failed every root
      # leg's site restore on exactly that. One small package; the apt
      # starvation this container exists to escape was dozens of large ones
      # under 29-way contention, a different failure class by an order of
      # magnitude.
      - name: Install zstd for the site cache
        if: matrix.config == 'playwright.config.ts'
        run: apt-get update -qq && apt-get install -y -qq zstd

      # A root leg restores the site `e2e-build-docs` built for this exact
      # commit; `fail-on-cache-miss` makes a missing build a loud failure
      # instead of a silent per-leg rebuild.
      - name: Restore the built site
        if: matrix.config == 'playwright.config.ts'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ github.sha }}
          fail-on-cache-miss: true

      # A harness leg mounts demos through a Vite dev server (seconds); a root
      # leg serves the restored site (`PW_PREBUILT_DOCS` switches the config's
      # webServer to preview-only) and runs the cross-cutting suite against it.
      # `e2e-plan` fixed the profile, the project and the config per row;
      # `--project` pins a leg to exactly one engine even when the profile
      # names more, and `${{ matrix.specs }}` from `join` is the set of harness
      # paths a component leg runs — the affected components' e2e dirs plus the
      # harness axe gate, empty for a root leg, whose config's `testMatch`
      # scopes it to the six crossing specs. The same projects feed
      # `matrix.demos`, which becomes `HARNESS_DEMOS` so the axe gate sweeps
      # exactly the demos the leg's component specs drive.
      # One step times the actual Playwright run: `SECONDS` counts from its own
      # line 0, and the final echo appends the elapsed seconds to the step
      # summary so the leg's browser evidence cost is one grep-able line per
      # matrix leg alongside GitHub's own step duration. `set -e` keeps a
      # failing playwright run a failing step: without it, the timing echo
      # after the `;` would turn a red leg green — the exact failure a CI
      # step must never do.
      - name: Run Playwright
        env:
          PW_PROFILE: ${{ matrix.profile }}
          HARNESS_DEMOS: ${{ join(matrix.demos, ',') }}
          PW_PREBUILT_DOCS: ${{ matrix.config == 'playwright.config.ts' && '1' || '' }}
        run: >-
          set -e;
          SECONDS=0;
          pnpm exec playwright test
          --project ${{ matrix.browser }}
          --config ${{ matrix.config }}
          ${{ join(matrix.specs, ' ') }}
          ${{ matrix.shardArgs }};
          echo "e2e-leg ${{ matrix.name }} profile=${{ matrix.profile }} browser=${{ matrix.browser }} ${{ matrix.config }} seconds=$SECONDS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Keyed by leg name, not profile: two failing legs of the same
          # profile would otherwise collide on the artifact name, and
          # upload-artifact rejects duplicates rather than merging them.
          # `run_attempt` too: artifact names are immutable within a run, so a
          # re-run of a still-failing leg would otherwise fail the upload.
          name: playwright-report-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    #
    # `e2e-run` is one entry despite running as a matrix: `needs` sees the job,
    # not its legs, and reports the worst result among them. That is what keeps
    # the browser split invisible from here — legs can be added or dropped
    # without the gate, or the branch ruleset naming it, having to know.
    #
    # An empty matrix is not a failure here. A no-op change (nothing relevant
    # changed) produces `include: []`, and `e2e-run` expands to zero browser
    # legs — GitHub reports that as success with nothing done, or skips the
    # job; either way it is the desired state, and `skipped` is deliberately
    # not treated as a failure below. There is no partial run: the include is
    # either empty and nothing runs, or populated and every leg runs.
    # `e2e-build-docs` is listed even though `e2e-run` already depends on it:
    # the gate treats `skipped` as acceptable (a run with no root legs builds
    # nothing), and only `failure`/`cancelled` block the merge.
    needs: [verify, e2e-discover, e2e-build-docs, e2e-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs` alone would let a cancelled job pass as green, since only
      # `failure` blocks a dependent job by default.
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
