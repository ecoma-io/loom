name: CI

on:
  # Every pull request, whatever it targets — deliberately unfiltered. A
  # `branches: [main]` filter here reads as "we only merge to main", which is
  # true, but what it actually does is skip CI on a pull request stacked on
  # another one: its base is a feature branch, so no run starts, and the change
  # is reviewed with no evidence at all until the branch below it merges and
  # GitHub retargets it. A pull request with no gate is the thing this file
  # exists to prevent, and where it happens to point is not a reason to allow it.
  pull_request:
  # The merge queue re-runs these checks against `main + every pull request
  # ahead in the queue + this one`, which is the only place a semantic conflict
  # between two independently-green pull requests can surface. GitHub reports
  # the result against the required check name below, so `ci-gate` must exist on
  # this event or the queue waits forever.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A merge-queue run must never be cancelled: the queue is blocked on exactly
  # this run, and cancelling it ejects the batch. `github.ref` is already unique
  # per queued batch, and `cancel-in-progress` is true only for pull requests.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The affected step below diffs this branch against a base commit, so
          # that base and every commit since it must be available locally — a
          # shallow single-commit checkout cannot resolve the ref. Full history
          # is the price of not pulling every ref.
          fetch-depth: 0

      # Reads the pnpm version from `packageManager` in package.json, so the
      # runner uses the same pnpm a contributor's Corepack fetches.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # `id` because the ESLint cache key below reads the version this
      # resolved to. `.node-version` pins the major only, so what that is
      # varies between runners.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every pull request lands as a squash, and the squash commit's subject is
      # the pull request title — so the title is the one commit message that
      # never reaches the `commit-msg` hook: no commit carrying that text exists
      # until GitHub writes it at merge time. Same commitlint configuration as
      # the hook, so a valid message has one definition rather than two.
      #
      # The title arrives through the environment, never through `${{ }}`
      # interpolation into the script: interpolation pastes it into the shell
      # source, where a title containing `$(...)` or a backtick would run.
      #
      # Release Please's pull requests are held to this too, which took a
      # configuration change to make possible rather than an exemption here.
      # Its default title pattern is `chore${scope}: release${version}`, and it
      # fills `${scope}` with the *target branch* — so a Release PR arrived
      # titled `chore(main): release 0.1.0`, and `main` is not one of the areas
      # `scope-enum` names because it is not an area of the code at all. The
      # pattern is pinned scopeless in `release-please-config.json`. Worth
      # knowing because the failure is structural: it is not one bad title but
      # every Release PR this repository will ever open, and the tempting fix —
      # adding `main` to `scope-enum` — buys the merge by making the scope list
      # mean something other than what it means.
      - name: Check the pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      # Skipped in the merge queue, and it is the only check that is. Prettier's
      # verdict is a pure function of each file's own bytes: merging other pull
      # requests into this one cannot unformat a file that was formatted, so
      # re-running it would re-prove what the pull-request run already proved.
      # Everything below can change under a merge — a type, a test, a bundle —
      # which is the entire reason the queue exists.
      - name: Check formatting
        if: github.event_name != 'merge_group'
        run: pnpm format:check

      # ESLint's own cache, and the key is the whole of the thinking. ESLint
      # stores a hash beside each cached file, but what that hash covers is
      # narrower than it looks: its own version, Node's, and the parts of that
      # file's resolved configuration that survive JSON serialisation. Rule
      # names, severities and options do — a rule tightened in
      # `eslint.config.mjs` invalidates the entries it applies to. Rule
      # *implementations* do not, because functions do not serialise. Measured
      # against this repository's ESLint: with a plugin rule swapped for one
      # that reports where the old one did not, and nothing else changed, the
      # cached verdict replays and the run exits 0 on code the new rule
      # forbids — silently, since a cache hit prints nothing.
      #
      # So the key names, in order, everything an entry's own hash reacts to:
      #
      # - The resolved Node version, because ESLint hashes `process.version`
      #   into every entry. `.node-version` pins the major only, so the patch
      #   is whatever the runner resolved — two runs of *this* workflow, eight
      #   minutes apart, got 24.19.0 and 24.18.0. Without this the second run
      #   downloads a cache it then rejects entry by entry and re-lints
      #   everything anyway; with it, the miss is honest and the fresh cache
      #   is saved under a key that says which Node produced it.
      # - `pnpm-lock.yaml`, because every rule implementation arrives through
      #   it and a plugin bump is exactly the silent case above.
      # - `eslint.config.mjs`, because the parser and plugin objects it wires
      #   up are the other half that does not serialise, and because a reader
      #   editing rules should not have to know which parts of this file the
      #   per-entry hash happens to cover.
      #
      # `github.sha` on the end, with everything before it as `restore-keys`:
      # a key that hits exactly is never written back, so a fixed key would
      # freeze the cache at the first commit that built it and cover fewer
      # files with every merge after. Restoring by prefix cannot cross any of
      # the three above, because the prefix holds all of them.
      #
      # After `pnpm install`, because the cache lives under `node_modules/` —
      # where Git, Prettier and ESLint already ignore it, which is what keeps
      # it out of a commit.
      - name: Cache ESLint results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('eslint.config.mjs', 'pnpm-lock.yaml') }}-

      # Type-aware, so a verdict here depends on files this branch never
      # touched: a signature another queued pull request changed can turn a call
      # site in this one into an unsafe-argument error that neither branch shows
      # alone. That interference is exactly what the queue re-runs to catch.
      #
      # `--cache-strategy content` inside the script, and it is what makes the
      # cache above worth restoring at all: the default keys each entry on size
      # and mtime, and a fresh checkout writes a new mtime on every file — a
      # perfectly restored metadata cache would then miss on all of it.
      #
      # That cache is why lint still runs moon-side for every affected project:
      # moon gives lint a restore-able hash key of its own, but dropping the
      # shared ESLint cache would re-lint every file of every affected project
      # on the first affected run after a base change.
      #
      # Otherwise the lint step here is retired: moon now owns lint, typecheck
      # and the published build, running each on this branch's affected projects
      # only. The three root scripts it replaces ran everything, every time.
      - name: Resolve affected base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        # `moon ci` supports --base / --head and diffs this branch against the
        # base ref to select affected projects. On a pull request the base is
        # the merge commit it will land on; on a push to main it is the commit
        # this one grew from. On the very first commit (a repository seed, or a
        # base that predates the checkout depth) `before` is the all-zero SHA,
        # which would diff against a commit that does not exist — so fall back
        # to the parent commit. Everything arrives via the environment, never
        # via `${{ }}` interpolation, so a branch name cannot run shell.
        run: |
          if [ "$PR_BASE" != "" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ "${PUSH_BEFORE//0/}" != "" ]; then
            echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # `pnpm lint` also ran `tools/check-component-artifacts.ts` — the
      # five-artifacts-per-component gate — which has no moon task. It is
      # hoisted out of the lint script into its own step so a component's
      # artifacts are checked on every run, not just the local one. The same
      # goes for `tools/check-architecture.ts`, which keeps the Moon dependency
      # graph, the facade-import boundary and the component-E2E ownership rules
      # mechanically enforced rather than review-recalled.
      - name: Check component artifacts
        run: node tools/check-component-artifacts.ts

      - name: Check architecture
        run: node --experimental-strip-types tools/check-architecture.ts

      - name: Moon affected lint and build
        run: pnpm exec moon ci --base "${{ steps.base.outputs.base }}"

      # `moon ci` selects the directly-changed projects for their tasks — the
      # dependent's tests do not run (see tools/affected-tests.ts). A button
      # edit proves button's 8 tests but not alert-dialog's, whose suite mounts
      # the very button that changed. The e2e side closes that closure already;
      # this step gives the unit suite the same coverage by re-driving the same
      # Moon test tasks over the downstream-closed set — a cache no-op for the
      # projects moon ci just ran, fresh tests only for the dependents.
      - name: Affected unit-test closure
        env:
          MOON_BASE: ${{ steps.base.outputs.base }}
        run: node --experimental-strip-types tools/affected-tests.ts

      # The type-check is a repository-wide verdict and moon ci no longer runs
      # it (see .moon/tasks/typecheck.yml) — the shared moon typecheck task is
      # per-project, and running a whole-repo vue-tsc once per affected project
      # is what pushed verify past its timeout on a fresh runner with no moon
      # cache. It is gated here as the one global pass `pnpm typecheck` was
      # always meant to be, the same way the full vitest suite is gated on the
      # merge queue and pushes.
      - run: pnpm typecheck

      # The whole-repo unit suite has moved off the pull-request path: `moon ci`
      # above already runs the affected projects' tests, with cross-component
      # imports now real moon deps (see tools/sync-moon-deps.ts), so a component
      # change proves its own tree's tests rather than all ~90 projects'. Vitest
      # re-runs those same files again here on every PR — that was the fixed
      # ~204s global suite the Phase 2 brief removed.
      #
      # The full suite is instead gated where it is the *reason for existing*:
      # the merge queue runs checks against `main + every PR ahead + this one`,
      # which is the only place two independently-green PRs can turn out to have
      # conflicting unit expectations, and a push to main re-proves the whole
      # repository on the commit that will be released.
      - name: Full repository unit suite (merge queue and pushes only)
        if: github.event_name != 'pull_request'
        run: pnpm test

      # The route, and not the build. A page that fails to build is still
      # caught before the merge — every root `e2e` leg builds the site through
      # Playwright's `webServer`, so the build already runs once per leg in
      # this same run, and building it again here re-proved what those had
      # proved. What no leg does is run `docs:stage`: nothing else before a
      # merge compares the Cloudflare route against the base the site is built
      # with, and that mismatch deploys successfully and serves nothing.
      #
      # `--check` is the half of that script that needs no build — it reads
      # `wrangler.jsonc` and `docs/.vitepress/base.ts` and compares them. The
      # copy half stays in `docs.yml`, which builds the site itself before
      # deploying it. Dropping the build without that seam would leave a check
      # that passes and then fails copying a directory nobody made.
      - run: pnpm docs:check-route

  # One discovery step replaces the fixed 3-browser × 8-shard matrix. `e2e-plan`
  # classifies what actually changed (see tools/e2e-plan.ts) and emits the exact
  # set of browser workloads the run needs: a docs-only change runs the axe
  # sweep at `standard`, a component change runs only the affected components'
  # own specs through the harness at `smoke`, a theme change runs both the sweep
  # and the theme-sensitive components, and a no-op (nothing relevant changed)
  # emits an empty `include` — `e2e-run` expands to zero legs and passes.
  #
  # The base is the same one `verify` resolves: on a pull request it is the
  # merge commit this branch will land on, on a push to main the commit it grew
  # from, and the `HEAD~1 || HEAD` fallback covers the very first commit.
  e2e-discover:
    name: E2E discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `e2e-plan` diffs the branch against the base, so that base and every
          # commit since it must be present locally — the same full-history price
          # `verify` pays.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # `tools/e2e-plan.ts` imports only node: built-ins, but it resolves the
      # affected set by shelling out to `moon` (`pnpm exec moon query projects
      # --affected`), which resolves through `node_modules/` — so the install is
      # required and deliberate, not skipped.
      - run: pnpm install --frozen-lockfile

      - name: Resolve affected base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$PR_BASE" != "" ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
          elif [ "${PUSH_BEFORE//0/}" != "" ]; then
            echo "base=$PUSH_BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # `e2e-plan` resolves the affected set against the base itself; the step
      # above only supplies that base. The tool prints the full report (scenario,
      # changed count, affected ids and the rows); the matrix consumes only the
      # `include` array, so the diagnostic fields never leak into a leg.
      - name: Compute the E2E matrix
        id: plan
        env:
          MOON_BASE: ${{ steps.base.outputs.base }}
        run: |
          node --experimental-strip-types tools/e2e-plan.ts --print > matrix.json
          NODE=$(node -e 'const m=require("./matrix.json"); process.stdout.write(JSON.stringify(m.include))')
          echo "matrix=$NODE" >> "$GITHUB_OUTPUT"

  e2e-run:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: e2e-discover
    timeout-minutes: 15
    strategy:
      # One battery failing in engine A must not hose the other engines' answer
      # to "is the break engine-specific?" — the question the browser spread
      # exists to answer.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # The matrix legs only ever reference one of the three engine browsers:
        # the root suite's projects are the engine project ids, and a harness
        # leg's `install` is its engine's browser name. Installing the three
        # engines unconditionally covers every profile — the mobile project ids
        # are viewports, not engines — and drops the per-leg install branching
        # that a fixed matrix paid for once and every leg repeated.
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # A harness leg mounts demos through a Vite dev server (seconds); a root
      # leg builds the docs site once through Playwright's webServer and runs
      # the cross-cutting suite against it. `e2e-plan` fixed the profile, the
      # project and the config per row; `--project` pins a leg to exactly one
      # engine even when the profile names more, and `${{ matrix.specs }}` from
      # `join` is the set of harness paths a component leg runs — the affected
      # components' e2e dirs plus the harness axe gate, empty for a root leg,
      # whose config's `testMatch` scopes it to the six crossing specs. The same
      # projects feed `matrix.demos`, which becomes `HARNESS_DEMOS` so the axe
      # gate sweeps exactly the demos the leg's component specs drive.
      - name: Run Playwright
        env:
          PW_PROFILE: ${{ matrix.profile }}
          HARNESS_DEMOS: ${{ join(matrix.demos, ',') }}
        run: >-
          pnpm exec playwright test
          --project ${{ matrix.browser }}
          --config ${{ matrix.config }}
          ${{ join(matrix.specs, ' ') }}
          ${{ matrix.shardArgs }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.profile }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  ci-gate:
    name: ci-gate
    # The single check name a branch ruleset requires, on pull requests and in
    # the merge queue alike. It exists so the required-check name is stable
    # while the job list is not: add a job to `needs` and the gate tightens
    # without anyone editing repository settings — and forgetting to add it is
    # the only way to widen what green means, which is visible in this file.
    #
    # `e2e-run` is one entry despite running as a matrix: `needs` sees the job,
    # not its legs, and reports the worst result among them. That is what keeps
    # the browser split invisible from here — legs can be added or dropped
    # without the gate, or the branch ruleset naming it, having to know.
    #
    # An empty matrix is not a failure here. A no-op change (nothing relevant
    # changed) produces `include: []`, and `e2e-run` expands to zero browser
    # legs — GitHub reports that as success with nothing done, or skips the
    # job; either way it is the desired state, and `skipped` is deliberately
    # not treated as a failure below. There is no partial run: the include is
    # either empty and nothing runs, or populated and every leg runs.
    needs: [verify, e2e-discover, e2e-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `needs` alone would let a cancelled job pass as green, since only
      # `failure` blocks a dependent job by default.
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
