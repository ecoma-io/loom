name: Release

# Versioning and publishing, in one workflow, and the reason they cannot be two
# is a GitHub rule rather than a preference: an event created with the default
# `GITHUB_TOKEN` does not trigger another workflow run. Release Please writes
# its tag and its GitHub Release with that token, so a `on: push: tags: v*`
# publish workflow would sit there and never fire — the tag exists, nothing runs,
# and the only symptom is a version nobody can install.
#
# So everything a release triggers is a job in this file, gated on Release
# Please's own output — the publish below, and the documentation deploy that
# `docs.yml` owns and this file calls. They run on the same commit the release
# job just tagged, which is also what makes the artifact traceable to a single
# run.
#
# The App token the release job now uses does technically lift that rule — an
# App's tag *can* trigger a workflow — but this file is not being split on the
# strength of it. Keeping the publish a job here keeps it gated on
# `release_created` and pinned to the commit this run tagged, which is what
# makes the artifact traceable to a single run; a tag-triggered workflow would
# be a second entry point reached by anything that writes a matching tag.
# https://docs.github.com/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release in flight. A cancelled publish can leave the tag and
# the GitHub Release written with nothing on the registry, which is the one
# state that needs a human to unpick.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # `release_created` is true only on the run where the Release PR itself
      # was merged — not on the run that opened or updated it. That is the whole
      # gate for the publish job below.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # An App token, not `GITHUB_TOKEN`, and the Release PR is unmergeable
      # without it. The same GitHub rule this file's header opens with — an
      # event created with `GITHUB_TOKEN` triggers no workflow — applies to the
      # pull request Release Please *opens*, not only to the tag it writes
      # later. So `ci-gate` and `Semgrep` never ran on it, and they are exactly
      # the two checks the branch ruleset requires: the one pull request whose
      # merge ships a release was the one pull request that could never go
      # green.
      #
      # Dispatching the workflows by hand does not fix it, which is worth
      # recording because it looks like it should. `workflow_dispatch` attaches
      # its check runs to the commit, and they are visible on the commit — but
      # the pull request's own status rollup does not list them, so the required
      # checks stay unsatisfied and the merge button stays blocked with every
      # check passing. The check has to be created by the pull-request event
      # itself, which means the pull request has to be opened by something other
      # than `GITHUB_TOKEN`.
      #
      # `ECOMA_APP_ID`/`ECOMA_APP_KEY` are the organisation's own App, installed
      # across `ecoma-io`. Its token also signs Release Please's commits, which
      # the `required_signatures` rule needs and which a raw PAT would not give.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ECOMA_APP_ID }}
          private-key: ${{ secrets.ECOMA_APP_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment is the audit trail, not a second approval step: every
    # publish is recorded against it. No reviewer is configured — a merged
    # Release PR is the decision, and asking for a second click after it would
    # only teach people to click.
    #
    # It carries no deployment branch policy today, so it is a record rather
    # than a restriction: the environment does not currently stop this job
    # running from a branch other than `main`. What does is the `if` above —
    # `release_created` is only ever true on a push to `main`. Restricting the
    # environment to `main` in repository settings would make the bound
    # structural instead of incidental, and is worth doing; it cannot be done
    # from this file.
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ steps.identity.outputs.name }}
    outputs:
      # Read out of the manifest rather than written again in the job below,
      # which has no checkout to read it from: a rename would otherwise leave
      # the verification installing a package that no longer exists and
      # reporting it as a failed publish.
      name: ${{ steps.identity.outputs.name }}
    permissions:
      # `contents: write` to attach the tarball and its attestation to the
      # GitHub Release the job before this one created. Release Please writes
      # that Release with no assets at all, and an OpenSSF Scorecard probe reads
      # asset filenames off the Release rather than the registry — npm's own
      # provenance, which this job already produces, is invisible to it.
      contents: write
      # Signs, and — once the bootstrap below is over — authenticates. npm
      # trusted publishing exchanges this short-lived OIDC token for publish
      # rights, which is what removes the stored npm token the first release
      # still needs. Until then the token does the authenticating and this does
      # the signing: `npm publish --provenance` mints its attestation from the
      # OIDC token regardless of what authorised the publish, as does the
      # attestation step further down, which takes its Sigstore signing
      # certificate from the same place.
      id-token: write
      # Persists the attestation to GitHub's attestations API, which is what
      # makes `gh attestation verify` work against the tarball independently of
      # the file attached to the Release.
      attestations: write
    steps:
      # The tag, not the branch: `main` may already have moved on by the time
      # this job starts, and publishing a commit the release does not point at
      # would put a version on the registry that matches no tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve the package name
        id: identity
        run: printf 'name=%s\n' "$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm 11.5.1 or newer. Asserted rather than
      # installed: `npm install --global npm@latest` used to stand here, and it
      # resolves whatever the registry serves at the moment of the run — an
      # unpinned dependency pulled into the one job that holds OIDC publish
      # rights, which is the last place to accept one. Node 24 has shipped an
      # npm past this floor since 24.0.0 (11.3.0 then, 11.17.0 today), so the
      # upgrade bought nothing the runner did not already provide.
      #
      # A check keeps what the upgrade was actually for. The requirement stays a
      # stated fact rather than an assumption about Node 24, and if a future
      # runner image ever regresses below it this fails here — before the
      # publish — naming the version it found, instead of failing inside `npm
      # publish` as an authentication error that reads like a broken trusted
      # publisher.
      # https://docs.npmjs.com/trusted-publishers
      - name: Require an npm that can publish over OIDC
        run: |
          set -euo pipefail
          required=11.5.1
          found=$(npm --version)
          # `sort -V` is the version-aware comparison; the lower of the two
          # sorts first, so the floor coming first means `found` is at or above
          # it. `-C` reports the verdict as an exit status and prints nothing.
          if printf '%s\n%s\n' "$required" "$found" | sort -VC; then
            echo "npm ${found} can publish over OIDC (needs >= ${required})."
          else
            echo "npm ${found} is below the ${required} that trusted publishing needs." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The published tarball is built here rather than downloaded from the CI
      # run: `files: ["dist"]` means the package is exactly this build's output,
      # and a build that happens in the publishing job is the one that cannot
      # have been substituted between the two.
      - run: pnpm build

      # One flag this still deliberately does not carry: `--access public`,
      # because it lives in `publishConfig` in package.json, where a scoped
      # package's visibility is a property of the package rather than of one
      # workflow step that could disagree with it.
      #
      # Token auth, and it is a bootstrap rather than the intended end state.
      # npm's trusted publishing cannot publish a package's *first* version: the
      # trusted publisher is configured on the package's settings page, and that
      # page does not exist until the package does. npm has confirmed this is
      # deliberate scoping rather than a bug, and the issue is still open —
      # https://github.com/npm/cli/issues/8544 — so the first release of
      # `@ecoma-io/loom` has to authenticate with a token.
      #
      # What makes this worth writing down is how it fails if you assume
      # otherwise: a trusted-publishing publish against a nonexistent package
      # reports `E404 Not Found - PUT` or `ENEEDAUTH need auth`, and both read
      # as a broken credential rather than a package that was never created.
      # https://github.com/npm/cli/issues/9088
      #
      # `--provenance` is explicit here because the flag is only implied by a
      # configured trusted publisher, which is exactly what does not exist yet.
      # Token auth still mints provenance — the OIDC token minted by
      # `id-token: write` signs the attestation, independently of what
      # authenticated the publish — so this bootstrap does not ship a release
      # weaker than the ones after it, and `verify-artifact` below holds it to
      # that by running `npm audit signatures`.
      #
      # Once 0.1.0 exists, configure the trusted publisher on npmjs.com and
      # revert this step to a bare `npm publish` with no `NODE_AUTH_TOKEN`:
      # every line of the credential below is meant to be deleted.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ECOMA_NPM_ACCESS_TOKEN }}
        run: npm publish --provenance

      # Everything below attaches to the GitHub Release what the registry
      # already has. It changes nothing about the publish above, and it is
      # deliberately after it: a failure here must not be able to leave the tag
      # written with nothing on the registry.
      #
      # The reason it is worth doing at all is that npm provenance and a GitHub
      # Release are two different claims to two different audiences. `npm audit
      # signatures` — which the next job runs — reads the registry. Tooling that
      # reads the repository instead, OpenSSF Scorecard's `Signed-Releases`
      # among it, looks at the assets on the Release and finds a Release Please
      # Release carries none.
      - name: Pack the published tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          # `npm pack` is byte-for-byte reproducible from the same `dist/`, so
          # this is the same tarball `npm publish` just sent rather than a
          # rebuild that merely resembles it — verified by packing twice and
          # comparing digests. Packing again is still cheaper and less invasive
          # than teaching `npm publish` to consume a prebuilt tarball, which
          # would put the release path itself on an untested branch.
          #
          # `--ignore-scripts` because `prepare` runs `lefthook install`, which
          # writes hooks and prints to stdout; nothing in it contributes to the
          # tarball. `--json` is parsed with `node -p` on a single line: npm
          # prints its config warnings to stdout too, so the filename is read
          # out of the JSON rather than by taking the last line of the output.
          npm pack --ignore-scripts --pack-destination /tmp/release --json > /tmp/pack.json
          file=$(node -p 'const s=require("fs").readFileSync("/tmp/pack.json","utf8");JSON.parse(s.slice(s.indexOf("[")))[0].filename')
          printf 'path=/tmp/release/%s\n' "$file" >> "$GITHUB_OUTPUT"
          printf 'name=%s\n' "$file" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.pack.outputs.path }}

      # The bundle the action writes is named `attestation.json`, and the name is
      # load-bearing rather than cosmetic: Scorecard's provenance probe matches
      # asset filenames by suffix and accepts `.intoto.jsonl` alone, so uploading
      # the file under the name the action chose would attach a real attestation
      # that no reader recognises. Renamed to what the format actually is — a
      # one-line in-toto JSON bundle.
      - name: Attach the tarball and its attestation to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARBALL: ${{ steps.pack.outputs.path }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ASSET: ${{ steps.pack.outputs.name }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "/tmp/release/${ASSET}.intoto.jsonl"
          gh release upload "$TAG" \
            "$TARBALL" \
            "/tmp/release/${ASSET}.intoto.jsonl" \
            --clobber

  verify-artifact:
    name: Verify the published artifact
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      # A publish that reports success and a package a consumer can actually
      # install are not the same claim. This job makes the second one, from
      # outside the repository, against the registry — the only place the
      # answer is real.
      #
      # `npm audit signatures` is what checks the provenance attestation rather
      # than merely finding the version, so a publish that produced no
      # attestation fails here instead of shipping quietly. That matters more
      # while the publish above authenticates with a token than it will
      # afterwards: provenance is implicit under a trusted publisher, but here
      # it rests on an explicit `--provenance` that a future edit could drop
      # without any other symptom.
      #
      # On the runner's own npm, for the reason the publish job states: an
      # unpinned `npm install --global npm@latest` used to run here too, and a
      # verification step is a poor place to introduce a dependency resolved at
      # run time — the job exists to make the registry's answer trustworthy.
      # `audit signatures` has been in npm since 8.x, so the bundled one is
      # already past what this needs and no floor check is warranted.
      - name: Install the published version and check its provenance
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          PACKAGE: ${{ needs.publish.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init --yes > /dev/null
          npm install "${PACKAGE}@${VERSION}"
          npm audit signatures
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const require = createRequire("/tmp/verify/");
            const name = process.env.PACKAGE;
            const manifest = require(`${name}/package.json`);
            if (manifest.version !== process.env.VERSION) {
              throw new Error(`registry served ${manifest.version}, expected ${process.env.VERSION}`);
            }
            console.log(`${name}@${manifest.version} resolves and carries provenance.`);
          '

  docs:
    name: Docs
    # `verify-artifact`, not `release-please`, and the extra wait is the point.
    # Every page on the documentation site is a live demonstration of the
    # library, so deploying it is a claim that this version behaves as shown.
    # `verify-artifact` is the job that proves a consumer can actually install
    # that version — until it is green, the claim has nothing behind it, and a
    # site describing a release that failed to publish is worse than a site one
    # release behind.
    needs: [release-please, verify-artifact]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    # Passed by name rather than `secrets: inherit`: naming it here keeps the one
    # workflow that hands a credential out from also being the one that would
    # hand out the next one.
    #
    # The `ECOMA_` prefix is the organisation's, and reading it here rather than
    # renaming the input is deliberate: the secret is shared across `ecoma-io`
    # repositories, so the prefix belongs to whoever owns it, while the name
    # `docs.yml` receives describes what that workflow does with it. A missing
    # secret interpolates to the empty string rather than failing — the
    # `required: true` on the receiving end only asserts the caller passed
    # something — so a prefix typo here surfaces as a Wrangler authentication
    # error at deploy time, which is why the two names are written down together.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ECOMA_CLOUDFLARE_API_TOKEN }}
    uses: ./.github/workflows/docs.yml
