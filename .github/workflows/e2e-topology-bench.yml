              workers: 1,
              specs: "e2e/target-size.e2e.ts e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # CAP_SYS_ADMIN is Firefox's sandbox requirement inside the job
      # container (measured 2026-08-26, recorded in ci.yml's `e2e-run`).
      options: --cap-add SYS_ADMIN
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The container user never matches the workspace mount's owner — recorded
      # in ci.yml's `e2e-run`, every leg died on "dubious ownership" without it.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: pnpm install --frozen-lockfile

      # actions/cache compresses with zstd and the Playwright image does not
      # ship it — the same one-package step `e2e-run` carries.
      - name: Install zstd for the site cache
        run: apt-get update -qq && apt-get install -y -qq zstd

      - name: Restore the built site
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ github.sha }}
          fail-on-cache-miss: true

      # `set -e` before the timing echo, or a red playwright run would print
      # its own seconds and pass — the failure mode ci.yml's step documents.
      #
      # The machine-readable line carries the Playwright-step SECONDS only:
      # created/started/completed times do not exist inside the step, they come
      # from the Actions API job record (queue wait = started_at − created_at
      # there), and analysis joins that record on the leg name.
      #
      # HOME=/root reaches the browser process where container-scoped env does
      # not (the runner overrides HOME; Firefox refuses to run as root
      # otherwise — measured, recorded in ci.yml).
      - name: Run Playwright
        if: matrix.topology == inputs.topology
        env:
          HOME: /root
          PW_PROFILE: standard
          PW_PREBUILT_DOCS: "1"
        run: >-
          set -e;
          SECONDS=0;
          pnpm exec playwright test
          --project ${{ matrix.browser }}
          --config playwright.config.ts
          --workers ${{ matrix.workers }}
          ${{ matrix.specs }}
          ${{ matrix.shards > 1 && format('--shard={0}/{1}', matrix.shard, matrix.shards) || '' }};
          echo "topo-leg name=${{ matrix.name }} topology=${{ matrix.topology }} browser=${{ matrix.browser }} group=${{ matrix.group }} shard=${{ matrix.shard }}/${{ matrix.shards }} workers=${{ matrix.workers }} playwright_seconds=$SECONDS" >> "$GITHUB_STEP_SUMMARY"

  # The capped variant of grouped-8: byte-identical rows and steps to
  # `bench-run`'s grouped-8 block, plus the literal cap under test. A separate
  # job because `strategy.max-parallel` cannot be switched by a dispatch
  # input without an expression, and this workflow's validity should not rest
  # on expression support in that one field.
  bench-run-capped:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: bench-build-docs
    if: inputs.topology == 'grouped-8-capped'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 16 = two thirds of the measured ~20-slot org ceiling (see the header):
      # the candidate value that would leave ~4 slots free for every other
      # workflow on the org while only one extra wave of 8 legs pays for it.
      max-parallel: 16
      matrix:
        include:
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-a11y-s1,
              browser: chromium,
              group: a11y,
              shard: 1,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-a11y-s2,
              browser: chromium,
              group: a11y,
              shard: 2,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-a11y-s3,
              browser: chromium,
              group: a11y,
              shard: 3,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-contrast-s1,
              browser: chromium,
              group: contrast,
              shard: 1,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-contrast-s2,
              browser: chromium,
              group: contrast,
              shard: 2,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-keyboard-s1,
              browser: chromium,
              group: keyboard,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/keyboard.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-target-size-s1,
              browser: chromium,
              group: target-size,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/target-size.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-chromium-small-s1,
              browser: chromium,
              group: small,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-a11y-s1,
              browser: firefox,
              group: a11y,
              shard: 1,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-a11y-s2,
              browser: firefox,
              group: a11y,
              shard: 2,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-a11y-s3,
              browser: firefox,
              group: a11y,
              shard: 3,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-contrast-s1,
              browser: firefox,
              group: contrast,
              shard: 1,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-contrast-s2,
              browser: firefox,
              group: contrast,
              shard: 2,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-keyboard-s1,
              browser: firefox,
              group: keyboard,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/keyboard.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-target-size-s1,
              browser: firefox,
              group: target-size,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/target-size.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-firefox-small-s1,
              browser: firefox,
              group: small,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-a11y-s1,
              browser: webkit,
              group: a11y,
              shard: 1,
              shards: 3,
              workers: 1,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-a11y-s2,
              browser: webkit,
              group: a11y,
              shard: 2,
              shards: 3,
              workers: 1,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-a11y-s3,
              browser: webkit,
              group: a11y,
              shard: 3,
              shards: 3,
              workers: 1,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-contrast-s1,
              browser: webkit,
              group: contrast,
              shard: 1,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-contrast-s2,
              browser: webkit,
              group: contrast,
              shard: 2,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-keyboard-s1,
              browser: webkit,
              group: keyboard,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/keyboard.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-target-size-s1,
              browser: webkit,
              group: target-size,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/target-size.e2e.ts",
            }
          - {
              topology: grouped-8-capped,
              name: topo-grouped-8-capped-webkit-small-s1,
              browser: webkit,
              group: small,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --cap-add SYS_ADMIN
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: pnpm install --frozen-lockfile

      - name: Install zstd for the site cache
        run: apt-get update -qq && apt-get install -y -qq zstd

      - name: Restore the built site
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ github.sha }}
          fail-on-cache-miss: true

      # No step-level topology gate here, unlike `bench-run`: the job-level
      # `if` already restricts this job to the grouped-8-capped dispatch, so
      # every row of its matrix is a leg that runs.
      - name: Run Playwright
        env:
          HOME: /root
          PW_PROFILE: standard
          PW_PREBUILT_DOCS: "1"
        run: >-
          set -e;
          SECONDS=0;
          pnpm exec playwright test
          --project ${{ matrix.browser }}
          --config playwright.config.ts
          --workers ${{ matrix.workers }}
          ${{ matrix.specs }}
          ${{ matrix.shards > 1 && format('--shard={0}/{1}', matrix.shard, matrix.shards) || '' }};
          echo "topo-leg name=${{ matrix.name }} topology=${{ matrix.topology }} browser=${{ matrix.browser }} group=${{ matrix.group }} shard=${{ matrix.shard }}/${{ matrix.shards }} workers=${{ matrix.workers }} playwright_seconds=$SECONDS" >> "$GITHUB_STEP_SUMMARY"

  # The digest that turns one dispatch into the answer: the Actions API job
  # record is the only place created_at / started_at / completed_at exist, and
  # this job is the one allowed to read it (actions: read — the workflow's
  # contents: read alone cannot). Runs even when legs fail: a bench whose leg
  # went red still carries its concurrency curve, which is often the point.
  bench-report:
    name: Bench · report
    runs-on: ubuntu-latest
    needs: [bench-run, bench-run-capped]
    if: always()
    permissions:
      actions: read
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # No checkout: the report reads the API and nothing else.
      - name: Print the concurrency curve
        run: |
          # --slurp wraps every page's array in one outer array, so the parse
          # stays valid however many pages the fan-out grows to — --paginate
          # with --jq concatenates pages without separators and yields invalid
          # JSON the moment a second page appears.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from datetime import datetime, timedelta

          def ts(s):
              return datetime.fromisoformat(s.replace("Z", "+00:00"))

          pages = json.load(open("/tmp/jobs.json"))
          jobs = [j for page in pages for j in page
                  if j["name"].startswith("topo-") and j["conclusion"] != "skipped"]
          if not jobs:
              print("no legs ran")
              raise SystemExit(0)
          print("## Topology bench — legs ran: %d" % len(jobs))
          print()
          print("| leg | queue wait s | wall m |")
          print("| --- | ---: | ---: |")
          for j in sorted(jobs, key=lambda x: x["started_at"]):
              q = (ts(j["started_at"]) - ts(j["created_at"])).total_seconds()
              w = (ts(j["completed_at"]) - ts(j["started_at"])).total_seconds() / 60
              print("| %s | %.0f | %.2f |" % (j["name"], q, w))
          t = min(ts(j["started_at"]) for j in jobs).replace(second=0)
          end = max(ts(j["completed_at"]) for j in jobs)
          pts = []
          while t < end:
              pts.append((t, sum(1 for j in jobs if ts(j["started_at"]) <= t < ts(j["completed_at"]))))
              t += timedelta(minutes=1)
          spread = (max(ts(j["started_at"]) for j in jobs) - min(ts(j["started_at"]) for j in jobs)).total_seconds() / 60
          waiters = sum(1 for j in jobs if (ts(j["started_at"]) - ts(j["created_at"])).total_seconds() > 60)
          print()
          print("- start spread: %.1f min; legs queuing > 60s: %d" % (spread, waiters))
          print("- concurrency curve: %s" % " ".join("%s=%d" % (t.strftime("%H:%M"), c) for t, c in pts))
          print("- max concurrent: %d" % max(c for _, c in pts))
          PY
