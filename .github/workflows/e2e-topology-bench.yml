              name: topo-flat-5-firefox-s3,
              browser: firefox,
              group: flat,
              shard: 3,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
              topology: flat-5,
              name: topo-flat-5-firefox-s4,
              browser: firefox,
              group: flat,
              shard: 4,
              shards: 5,
              workers: 1,
              specs: "",
            }
