              group: ts-small,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/target-size.e2e.ts e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
          - {
              topology: reduced-6,
              name: topo-reduced-6-firefox-a11y-s1,
              browser: firefox,
              group: a11y,
              shard: 1,
              shards: 2,
              workers: 2,
