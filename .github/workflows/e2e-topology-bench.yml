              workers: 1,
              specs: "e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
          # ---- flat-5: the legacy 5 shards × 3 browsers = 15, no groups ----
          # Empty specs: the config's own testMatch scopes each shard, exactly
          # as the pre-#368 legs ran (their API names carried no group either,
          # which is why the name pattern drops the group segment here).
          - {
              topology: flat-5,
              name: topo-flat-5-chromium-s1,
              browser: chromium,
              group: flat,
              shard: 1,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
              topology: flat-5,
              name: topo-flat-5-chromium-s2,
              browser: chromium,
              group: flat,
              shard: 2,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
              topology: flat-5,
              name: topo-flat-5-chromium-s3,
              browser: chromium,
              group: flat,
              shard: 3,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
              topology: flat-5,
              name: topo-flat-5-chromium-s4,
              browser: chromium,
              group: flat,
              shard: 4,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
              topology: flat-5,
              name: topo-flat-5-chromium-s5,
              browser: chromium,
              group: flat,
              shard: 5,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
              topology: flat-5,
              name: topo-flat-5-firefox-s1,
              browser: firefox,
              group: flat,
              shard: 1,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
