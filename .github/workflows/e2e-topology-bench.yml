name: E2E topology bench

# The instrument for the queueing question behind PR #368: the spec-group
# topology fans out more legs than the org has runner slots for, and the two
# pw-infra CI runs of that PR (34597507798/34606614010, 40+3 legs each) both
# hit a hard plateau of 20 concurrent legs for ~7 minutes — leg starts spread
# over ~9m and 24-25 of 43 legs waited over a minute in queue, so the 17.1m
# run wall was set by the slot ceiling and the start spread, not by test work
# (Σ leg walls ÷ 20 ≈ 12m of it is saturated drain). Which leg cut is best is
# therefore a question about queueing, and queueing only shows up on real
# runners: one dispatch of this workflow runs the EXACT leg set a given
# topology would emit for a docs-class PR, on production runner images, so the
# concurrency curve can be read off the Actions API without opening a PR.
#
# This workflow is a benchmark, not a gate: nothing in `ci.yml` references it,
# no job of a pull-request run waits on it, and a red bench answers a
# measurement question rather than blocking a merge.
#
# Reading the result: created_at / started_at / completed_at / runner_name per
# leg come only from the Actions API —
#   gh api 'repos/ecoma-io/loom/actions/runs/<run-id>/jobs?per_page=100'
# (queue wait = started_at − created_at; a leg is running when
# started_at ≤ t < completed_at). The `bench-report` job at the bottom prints
# exactly that curve into the run summary so a dispatch answers on its own.

on:
  workflow_dispatch:
    inputs:
      topology:
        # One dispatch = one rep. The four cuts, and what each is for:
        # - grouped-8       the plan PR #368 ships (3 desktop browsers × 8
        #                   spec-group legs = 24) — the incumbent to beat.
        # - grouped-8-capped the same 24 legs with a job-level max-parallel:
        #                   16, the candidate that trades wall for leaving
        #                   ~4 slots free for the rest of CI.
        # - flat-5          the legacy 5 shards × 3 browsers = 15 legs, the
        #                   pre-#368 baseline whose docs-PR P50 was 15.23m.
        # - reduced-6       the candidate cut that fights queueing by
        #                   shrinking the fleet instead of capping it:
        #                   a11y×2, contrast×2, keyboard×1, and target-size
        #                   merged with small — 18 legs.
        description: Leg topology to fan out
        required: true
        default: grouped-8
        type: choice
        options:
          - grouped-8
          - grouped-8-capped
          - flat-5
          - reduced-6

permissions:
  contents: read

concurrency:
  # Keyed by topology, not just the ref, for the reason e2e-bench.yml
  # recorded (2026-09-11: a ref-only group let one dispatch cancel another);
  # two benches of different topologies are different measurements and must
  # not cancel each other.
  group: e2e-topology-bench-${{ github.ref }}-${{ inputs.topology }}
  cancel-in-progress: true

jobs:
  # Identical to `bench-build-docs` in e2e-bench.yml, which is itself the
  # production `e2e-build-docs` shape: one build per run, the site travels
  # under the same immutable `docs-dist-<sha>` key, and the legs restore it
  # with fail-on-cache-miss so a silently missing build turns a leg red
  # instead of quietly rebuilding inside every leg.
  bench-build-docs:
    name: Bench · build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history because `moon run` resolves `main` against the
      # remote-tracking ref (the failure is recorded in ci.yml's
      # `e2e-build-docs` checkout comment — this is that same price).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Split restore/save (not combined `actions/cache`): a failed build must
      # not freeze a partial dist under the immutable key — same reason
      # `e2e-build-docs` spells it this way.
      - name: Restore an already-built site
        id: docs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ github.sha }}

      - name: Build the docs site
        if: steps.docs-cache.outputs.cache-hit != 'true'
        env:
          MOON_CONCURRENCY: "4"
        run: pnpm exec moon run docs:build

      - name: Save the built site
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ github.sha }}

  # The uncapped topologies. There is deliberately NO max-parallel here: the
  # point of running them is to observe where the org's runner ceiling bites,
  # and a job-level cap of any size would make a ceiling above that number
  # unmeasurable. Production `e2e-run` carries no cap either, so this is the
  # faithful shape.
  #
  # `max-parallel` cannot be switched per dispatch without an expression, and
  # the capped variant is its own job below with the literal 16 — the two
  # jobs' step bodies are byte-identical on purpose, so a change to one is
  # visible as a diff against the other.
  bench-run:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: bench-build-docs
    if: inputs.topology != 'grouped-8-capped'
    # Sized from measured leg walls, and the queue allowance deliberately does
    # NOT appear in the number: GitHub starts a job's timeout clock at
    # started_at, which is after the queue, so the queue wait is bounded by
    # the cap (or the org ceiling) rather than by this budget. What this number
    # must cover is the pole leg: 10.25m measured on the #368 spec-group legs
    # (34597507798, firefox a11y w=2), 14.8m on the flat-5 shards (34583209459),
    # plus ~1m per-leg setup and headroom for Playwright's two CI retries —
    # the same arithmetic ci.yml's `e2e-run` used for its 20.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The spec→leg map is literals because dispatch inputs are static — the
      # same trade e2e-bench.yml records on its GROUP_SHARDS/GROUP_SPECS env:
      # re-cutting a topology must update this matrix in the same commit.
      # Three topologies share this job and a row's `topology` field is what
      # the steps gate on; unselected rows report as jobs with skipped steps,
      # which is the right shape for a benchmark (and a job-level `if` cannot
      # do it — `matrix` does not exist when the job-level `if` evaluates, the
      # dispatch API rejected exactly that in e2e-bench.yml).
      matrix:
        include:
          # ---- grouped-8: 3 desktop browsers × 8 spec-group legs = 24 ----
          # Spec lists restated from tools/e2e-plan.ts ROOT_SHARD_PLAN; a11y
          # runs workers 2 on chromium and firefox (ROOT_WORKERS), webkit stays
          # at 1 — the measured leg shape, not a knob.
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-a11y-s1,
              browser: chromium,
              group: a11y,
              shard: 1,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-a11y-s2,
              browser: chromium,
              group: a11y,
              shard: 2,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-a11y-s3,
              browser: chromium,
              group: a11y,
              shard: 3,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-contrast-s1,
              browser: chromium,
              group: contrast,
              shard: 1,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-contrast-s2,
              browser: chromium,
              group: contrast,
              shard: 2,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-keyboard-s1,
              browser: chromium,
              group: keyboard,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/keyboard.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-target-size-s1,
              browser: chromium,
              group: target-size,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/target-size.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-chromium-small-s1,
              browser: chromium,
              group: small,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-a11y-s1,
              browser: firefox,
              group: a11y,
              shard: 1,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-a11y-s2,
              browser: firefox,
              group: a11y,
              shard: 2,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-a11y-s3,
              browser: firefox,
              group: a11y,
              shard: 3,
              shards: 3,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-contrast-s1,
              browser: firefox,
              group: contrast,
              shard: 1,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-contrast-s2,
              browser: firefox,
              group: contrast,
              shard: 2,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-keyboard-s1,
              browser: firefox,
              group: keyboard,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/keyboard.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-target-size-s1,
              browser: firefox,
              group: target-size,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/target-size.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-firefox-small-s1,
              browser: firefox,
              group: small,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/focus-not-obscured.e2e.ts e2e/layout-responsive.e2e.ts e2e/reduced-motion.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-webkit-a11y-s1,
              browser: webkit,
              group: a11y,
              shard: 1,
              shards: 3,
              workers: 1,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-webkit-a11y-s2,
              browser: webkit,
              group: a11y,
              shard: 2,
              shards: 3,
              workers: 1,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-webkit-a11y-s3,
              browser: webkit,
              group: a11y,
              shard: 3,
              shards: 3,
              workers: 1,
              specs: "e2e/accessibility.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-webkit-contrast-s1,
              browser: webkit,
              group: contrast,
              shard: 1,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-webkit-contrast-s2,
              browser: webkit,
              group: contrast,
              shard: 2,
              shards: 2,
              workers: 1,
              specs: "e2e/contrast.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-webkit-keyboard-s1,
              browser: webkit,
              group: keyboard,
              shard: 1,
              shards: 1,
              workers: 1,
              specs: "e2e/keyboard.e2e.ts",
            }
          - {
              topology: grouped-8,
              name: topo-grouped-8-webkit-target-size-s1,
              browser: webkit,
              group: target-size,
              shard: 1,
