              topology: flat-5,
              name: topo-flat-5-webkit-s4,
              browser: webkit,
              group: flat,
              shard: 4,
              shards: 5,
              workers: 1,
              specs: "",
            }
          - {
              topology: flat-5,
              name: topo-flat-5-webkit-s5,
              browser: webkit,
              group: flat,
              shard: 5,
              shards: 5,
              workers: 1,
              specs: "",
            }
          # ---- reduced-6: 6 legs per browser = 18 ----
          # a11y re-cut from 3 shards to 2 (same total work, half per leg),
          # target-size merged with `small` — the merged leg passes the union
          # of the two spec lists positionally, so Playwright runs one browser
          # pass over four files instead of two browser passes over one each.
          - {
              topology: reduced-6,
              name: topo-reduced-6-chromium-a11y-s1,
              browser: chromium,
              group: a11y,
              shard: 1,
              shards: 2,
              workers: 2,
              specs: "e2e/accessibility.e2e.ts",
