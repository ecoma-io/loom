# Memory-leak rules for Loom.
#
# A leak in a component library is not a slow tab, it is a slow tab in every
# product that mounts the component — and it appears where the component is used
# most, which is usually a long-lived screen nobody reloads. Every rule here
# targets the same shape: something with a lifetime longer than the component
# that created it, where the handle needed to end that lifetime was never kept.
#
# Only teardown-shaped leaks are machine-checkable this way. Retention leaks —
# a module-level cache that grows, a closure that captures a detached node — are
# on review, and are why `WeakMap`/`WeakSet` are the default for anything keyed
# by a DOM node.
#
# One rule here polices a second contract instead: `loom-browser-api-at-module-scope`
# enforces the import-time half of "no JS module side effects" — a module that
# touches the browser while it is being evaluated runs that code in every
# consumer that imports it, rendered or not.
#
# Run locally: `uvx semgrep scan --config .github/semgrep --exclude
# .github/semgrep`. CI enforces the same rules, and `uvx semgrep --test --config
# .github/semgrep .github/semgrep` runs the fixtures beside this file.
rules:
  - id: loom-inline-listener-cannot-be-removed
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An inline function passed to `addEventListener` has no name anything else
      can reach, so `removeEventListener` can never match it and the listener
      outlives the component. Hoist the handler to a named binding and remove it
      on unmount, or pass `{ signal }` from an `AbortController` you abort, or
      `{ once: true }` when it genuinely fires once.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $TARGET.addEventListener($EVENT, (...) => { ... }, ...)
          - pattern: $TARGET.addEventListener($EVENT, function (...) { ... }, ...)
      - pattern-not: "$TARGET.addEventListener($EVENT, $HANDLER, { ..., once: true, ... })"
      - pattern-not: "$TARGET.addEventListener($EVENT, $HANDLER, { ..., signal: $SIGNAL, ... })"

  - id: loom-remove-listener-with-inline-handler
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      `removeEventListener` compares handlers by identity, so a freshly written
      inline function never matches the one that was registered — this call
      removes nothing and reads as if it did. Pass the same reference that was
      added.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: HIGH
    pattern-either:
      - pattern: $TARGET.removeEventListener($EVENT, (...) => { ... }, ...)
      - pattern: $TARGET.removeEventListener($EVENT, function (...) { ... }, ...)

  - id: loom-global-listener-at-module-scope
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A listener registered while the module is evaluating is never removed, is
      installed even for consumers that import the module and render nothing,
      and is duplicated on every hot reload. Register inside the component and
      remove it on unmount.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: window.addEventListener(...)
          - pattern: document.addEventListener(...)
          - pattern: globalThis.addEventListener(...)
      - pattern-not-inside: function $F(...) { ... }
      - pattern-not-inside: (...) => { ... }
      - pattern-not-inside: function (...) { ... }
      - pattern-not-inside: class $C { ... }

  - id: loom-browser-api-at-module-scope
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      This touches the browser while the module is evaluating, so the code runs
      in every consumer that imports the module — rendered or not — and turns
      the import into a side effect bundlers cannot drop. Do the read inside
      the component's lifecycle or the composable's setup; a module that
      genuinely must branch on the environment guards the read with
      `typeof window !== "undefined"`, and wrapping the read in a function
      expression that is invoked immediately is not a deferral — an IIFE runs
      its body while the module is evaluating.
    # This rule carries no CWE on purpose, unlike the rules beside it: it
    # enforces Loom's own import-time contract rather than a leak shape, and
    # the harm is a consumer's server render crashing on `window` — not
    # retained memory.
    metadata:
      category: correctness
      confidence: HIGH
    # Scoped to the library on purpose. The import-time contract binds the
    # modules a consumer imports; the Playwright harness's own entry pages
    # (`playwright/harness/conformance.ts`, `main.ts`) are `layer-e2e`
    # artifacts whose module scope *is* the page load — reading
    # `window.location.search` there is what a mounted page does, not a side
    # effect smuggled into someone's import. The second include is the fixture
    # directory, so `semgrep --test` can still see the rule's own fixtures.
    paths:
      include:
        - packages/**
        - .github/semgrep/**
    patterns:
      # A read is matched through its member expression, and the bare
      # `matchMedia(...)` call is the one read reached without a recipient
      # prefix. The call shapes this rule used to carry (`window.$METHOD(...)`)
      # were dropped on purpose: the callee member inside the call is the same
      # read, and matching both shapes drew two findings for one defect —
      # probed on semgrep 1.172.0, a module-scope `window.matchMedia(...)`
      # reported twice. `pattern-not-inside` cannot deduplicate that pair: its
      # range test includes the node itself, so exempting the call would
      # silence the member inside it as well.
      #
      # The two branches below split on where the read lives, and both carry
      # the same read set (the YAML anchor), because a read is either at
      # module scope (branch A) or inside a body that runs at import anyway
      # (branch B) — exactly one of the two can match a given read, so one
      # defect is one finding.
      - pattern-either:
          # Branch A — reads outside anything that defers evaluation to a
          # later call.
          - patterns:
              - pattern-either: &module_scope_reads
                  - pattern: window.$MEMBER
                  - pattern: document.$MEMBER
                  - pattern: navigator.$MEMBER
                  - pattern: localStorage.$MEMBER
                  - pattern: matchMedia(...)
              # A read inside a deferring body runs when that body runs, not
              # at import — the component lifecycle and composable setup the
              # message points at.
              - pattern-not-inside: function $F(...) { ... }
              # Both arrow shapes need exempting: a concise body
              # (`() => window.innerWidth`) defers the read to call time just
              # like a block body does, and without this row it would be
              # reported as if it ran at import.
              - pattern-not-inside: (...) => { ... }
              - pattern-not-inside: (...) => $EXPR
              - pattern-not-inside: function (...) { ... }
              - pattern-not-inside: class $C { ... }
          # Branch B — the same reads inside an immediately-invoked body:
          # exempted syntactically by branch A, but the invocation happens
          # while the module is evaluating, which is the whole defect. The
          # inside-match is the invocation itself, so it reaches every depth
          # of the body — an IIFE whose body calls inner functions is the
          # common shape, not a hole in the rule.
          - patterns:
              - pattern-either: *module_scope_reads
              - pattern-inside: (function $F(...) { ... })()
          - patterns:
              - pattern-either: *module_scope_reads
              - pattern-inside: (function (...) { ... })()
          - patterns:
              - pattern-either: *module_scope_reads
              - pattern-inside: (() => { ... })(...)
          - patterns:
              - pattern-either: *module_scope_reads
              # The trailing (...) is load-bearing: paired with the arrow's
              # own parameters it is what makes semgrep see the concise arrow
              # and its invoking call as one expression
              # (`(() => document.title)("x")` went unseen without it).
              - pattern-inside: (() => $EXPR)(...)
      # Listener registration is the rule above's finding, and one defect shape
      # has one rule: without these exemptions the same module-scope
      # `window.addEventListener(...)` line draws two reports. The call form
      # alone is not enough — `window.$MEMBER` also matches the bare member
      # expression inside the call, so both shapes need excluding.
      - pattern-not: $TARGET.addEventListener(...)
      - pattern-not: $TARGET.addEventListener
      - pattern-not: $TARGET.removeEventListener(...)
      - pattern-not: $TARGET.removeEventListener
      # The sanctioned guard. `typeof` itself is not a member read, so the
      # guard expression never matches; these exempt the reads a guard wraps,
      # in the three shapes a guard is written: the plain `if`, the compound
      # `if` with further conjuncts — the ellipses on both sides of the
      # `typeof` cover every position it can sit in (probed: first, last and
      # middle; the plain guard is deliberately not covered by that row, so
      # it keeps its own) — and the conditional-expression form, each shape
      # in all four comparison polarities.
      - pattern-not-inside: if (typeof $GLOBAL !== $UNDEF) { ... }
      - pattern-not-inside: if (... && typeof $GLOBAL !== $UNDEF && ...) { ... }
      - pattern-not-inside: if (typeof $GLOBAL === $UNDEF) { ... }
      - pattern-not-inside: if (... && typeof $GLOBAL === $UNDEF && ...) { ... }
      - pattern-not-inside: if (typeof $GLOBAL != $UNDEF) { ... }
      - pattern-not-inside: if (... && typeof $GLOBAL != $UNDEF && ...) { ... }
      - pattern-not-inside: if (typeof $GLOBAL == $UNDEF) { ... }
      - pattern-not-inside: if (... && typeof $GLOBAL == $UNDEF && ...) { ... }
      - pattern-not-inside: "typeof $GLOBAL !== $UNDEF ? $THEN : $ELSE"
      - pattern-not-inside: "typeof $GLOBAL === $UNDEF ? $THEN : $ELSE"
      - pattern-not-inside: "typeof $GLOBAL != $UNDEF ? $THEN : $ELSE"
      - pattern-not-inside: "typeof $GLOBAL == $UNDEF ? $THEN : $ELSE"

  - id: loom-discarded-timer-handle
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      The handle this returns is the only way to stop the timer. Discarded, the
      callback keeps running — and keeps its whole closure, including any DOM
      node it captured, alive — after the component is gone. Keep the handle and
      clear it on unmount.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: setInterval(...)
          - pattern: window.setInterval(...)
      - pattern-not-inside: $X = setInterval(...)
      - pattern-not-inside: $X = window.setInterval(...)
      - pattern-not-inside: return setInterval(...)
      - pattern-not-inside: return window.setInterval(...)

  - id: loom-discarded-observer
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      An observer holds a strong reference to every node it observes, and only
      `disconnect()` releases them. Discarding the instance makes that call
      impossible, so the observed subtree can never be collected. Keep the
      instance and disconnect it on unmount.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: new ResizeObserver(...)
          - pattern: new MutationObserver(...)
          - pattern: new IntersectionObserver(...)
          - pattern: new PerformanceObserver(...)
      # `new ResizeObserver(cb).observe(el)` is deliberately still a finding:
      # chaining `observe` off the constructor is exactly the shape that leaves
      # no reference to disconnect.
      - pattern-not-inside: $X = new $OBSERVER(...)
      - pattern-not-inside: return new $OBSERVER(...)

  - id: loom-discarded-long-lived-connection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      This opens something that stays open — a socket, a stream, a worker
      thread — and the returned instance is the only handle that can close or
      terminate it. Keep it and close it on unmount.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: new WebSocket(...)
          - pattern: new EventSource(...)
          - pattern: new Worker(...)
          - pattern: new SharedWorker(...)
          - pattern: new BroadcastChannel(...)
      - pattern-not-inside: $X = new $CONNECTION(...)
      - pattern-not-inside: return new $CONNECTION(...)

  - id: loom-object-url-never-revoked
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      `createObjectURL` pins the whole Blob in memory until `revokeObjectURL` is
      called for that exact URL — reloading the document does not release it.
      Revoke it as soon as the consumer has loaded it.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: LOW
    patterns:
      - pattern: URL.createObjectURL(...)
      - pattern-not-inside: |
          function $F(...) {
            ...
            URL.revokeObjectURL(...)
            ...
          }
      - pattern-not-inside: |
          (...) => {
            ...
            URL.revokeObjectURL(...)
            ...
          }

  - id: loom-body-append-without-removal
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A node appended to `document.body` outlives the component that appended
      it, together with everything its listeners close over. Prefer `<Teleport>`,
      which unmounts with its owner; if the node has to be appended by hand,
      remove it in the same scope's teardown.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: document.body.appendChild($NODE)
          - pattern: document.body.append($NODE, ...)
      # Silenced by any teardown registered in the same function — the rule
      # points at scopes that append and then forget, not at every append.
      - pattern-not-inside: |
          function $F(...) {
            ...
            onUnmounted(...)
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            onBeforeUnmount(...)
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            $PARENT.removeChild(...)
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            $NODE.remove()
            ...
          }

  - id: loom-reactive-effect-at-module-scope
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A reactive effect created while the module is evaluating belongs to no
      component scope, so nothing ever stops it — it holds its dependencies for
      the lifetime of the page. Create it inside `setup` (where Vue disposes it
      automatically) or inside an `effectScope` you stop yourself.
    metadata:
      category: correctness
      cwe: "CWE-401: Missing Release of Memory after Effective Lifetime"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: watch(...)
          - pattern: watchEffect(...)
          - pattern: watchPostEffect(...)
          - pattern: watchSyncEffect(...)
      - pattern-not-inside: function $F(...) { ... }
      - pattern-not-inside: (...) => { ... }
      - pattern-not-inside: function (...) { ... }
      - pattern-not-inside: class $C { ... }
