# Git hooks — installed by `pnpm install` (the `prepare` script runs
# `lefthook install`). Rationale and the full contributor flow: CONTRIBUTING.md.

pre-commit:
  parallel: false
  commands:
    format:
      # Format only what is staged, then re-stage whatever Prettier rewrote, so
      # the commit contains the formatted bytes rather than a follow-up fixup.
      glob: "*.{ts,mts,cts,mjs,cjs,js,vue,json,jsonc,json5,md,yml,yaml,css,html}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      # Same cache file as `pnpm lint`, deliberately. ESLint keys an entry by
      # the file's absolute path, so the staged-file run here and the whole-tree
      # run there address the same entries rather than two half-populated
      # copies, and a partial run rewrites only what it linted — the entries for
      # files it was never given survive. So a commit warms the cache for the
      # `pnpm lint` that follows it, and the other way round.
      #
      # `content` rather than the default `metadata`, which keys on size and
      # mtime: `git checkout`, `git stash` and a rebase all rewrite mtimes on
      # files whose bytes never changed, and on a CI runner a fresh clone
      # rewrites every one of them — a metadata-keyed cache would restore
      # perfectly and then miss on all of it.
      #
      # Under `node_modules/` because that is already ignored by Git, Prettier
      # and ESLint alike; a cache file at the repository root would need adding
      # to all three, and a committed one is a defect of its own.
      glob: "*.{ts,mts,cts,mjs,cjs,js,vue}"
      run: pnpm exec eslint --no-warn-ignored --cache --cache-strategy content --cache-location
        node_modules/.cache/eslint --max-warnings 0 {staged_files}

pre-push:
  parallel: false
  commands:
    typecheck:
      # The Vite build strips types without checking them, so a type error is
      # only ever caught here or in CI — never by `build`.
      run: pnpm run typecheck
    test:
      run: pnpm run test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
