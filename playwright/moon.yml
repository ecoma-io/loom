tags: ["layer-e2e"]

project:
  name: "playwright"
  description: "The component E2E harness and the browser profiles both Playwright configs read"

# `playwright/` held real TypeScript that no Moon project owned: profiles.ts —
# the single source of the browser matrix, read by both Playwright configs and
# by tools/e2e-plan.ts — plus the harness's Vite config, its entry, and the
# harness axe gate. Owned by nobody, none of it was linted or type-checked by
# `moon ci`, and `lattice check` (Archkeep, before the rename) skipped it
# outright: a file belonging to no project was not analyzed, was not counted,
# and did not lower the coverage percentage. Six files were invisible to both
# gates at once. Archkeep names such files now; this directory earned a project
# instead of an acceptance row.
#
# No `e2e` tag, deliberately. The shared e2e task (.moon/tasks/e2e.yml) is
# inherited by that tag and drives a component's own specs through this
# harness; this project *is* the harness, and a task pointed at itself would
# collect every component's specs at once — the over-collection the affected
# model exists to avoid. The harness's own gate runs as part of each
# component's e2e task instead.
deps:
  # preserved
  - "loom"
  # The conformance route loads the compositions' e2e/conformance.cases.ts
  # files through a glob (playwright/harness/conformance.ts) — since Phase 4D
  # (ecoma-io/loom#322) no specifier names that reach, and a glob's edges are
  # exactly what neither architecture reader can see, so the edges stay
  # hand-declared here: this is what makes an engine or case-file change
  # re-run this project's own lint, tests and analysis. The set is held
  # against the tree by playwright/harness/conformance-registry.test.ts,
  # which fails if the glob stops reaching a composition that owns cases —
  # and a composition landing here needs its `# preserved` line added by
  # hand, because no tool can derive an edge nothing resolves.
  # preserved
  - "stack"
  # preserved
  - "inline"
  # preserved
  - "center"
  # preserved
  - "frame"
  # preserved
  - "sidebar"
  # preserved
  - "grid"
  # preserved
  - "dashboard-grid"
  # preserved
  - "split"

tasks:
  # Inherits lint and test from .moon/tasks/*.yml. The test task runs exactly
  # one file here — conformance-registry.test.ts, the harness's registry
  # derivation held against the tree — so a harness edit re-runs the
  # registry law in this project's own affected closure; the lint task is
  # the other point.
