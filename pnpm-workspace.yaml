# pnpm's settings file. This repository is a single package, not a workspace —
# the file exists because pnpm moved its settings out of `package.json` into
# here, and pnpm 11 no longer reads the `pnpm` field there at all. There is
# deliberately no `packages:` key: adding one would make this a workspace, which
# is the shape extracting Loom out of a monorepo was meant to leave behind.

# Every dependency install script is blocked until it is decided on here, and
# pnpm fails the install while any decision is missing — so an unreviewed
# postinstall cannot run in CI just because it shipped in a new release.
#
# esbuild: false — reached only through the Vite 5 that VitePress bundles. Its
# postinstall swaps the JavaScript `bin/esbuild` shim for the native binary,
# which saves a few milliseconds of Node startup and nothing else: the shim
# resolves `@esbuild/<platform>` at run time either way, and that package
# arrives as an ordinary optional dependency. Measured with the script blocked —
# the documentation site still builds.
#
# lefthook: false — its postinstall only runs `lefthook install`, which this
# package's `prepare` script already does, and which lefthook itself skips
# whenever `CI` is set. The binary comes from optionalDependencies and needs no
# build step, so nothing is lost by never running it.
#
# workerd: false — reached through wrangler, and the same shape as esbuild
# above: `install.js` swaps the JavaScript `bin/workerd` shim for the native
# binary out of `@cloudflare/workerd-<platform>`, which arrives on its own as an
# ordinary optional dependency. The shim resolves that package at run time
# either way. Nothing this repository runs needs the local runtime at all —
# `wrangler deploy` uploads a directory of static assets and never starts a
# worker — so what the script saves here is a process spawn that never happens.
# Measured with the script blocked: `wrangler deploy --dry-run` is green.
#
# vue-demi: false — reached through `@floating-ui/vue`, under Reka UI. Its
# postinstall rewrites `lib/index.*` to match the installed Vue major, and the
# copy it ships is already the Vue 3 one (`isVue3 = true`). Loom's
# `peerDependencies` admit Vue 3 alone, so the rewrite would produce the file
# that is already on disk.
allowBuilds:
  esbuild: false
  lefthook: false
  vue-demi: false
  workerd: false
