project:
  name: "docs"
  description: "The VitePress documentation site, built out of the library"

# The docs site has no package.json of its own — its build and route-check live
# in the root workspace package, so both tasks run with the shared flags and
# runFromWorkspaceRoot. Making the site a project means a change under docs/
# marks it affected, and `moon ci` runs the docs build/route-check instead of
# every diff silently skipping the site.
tasks:
  build:
    command: "pnpm docs:build"
    options:
      cache: true
      runInCI: affected
      runFromWorkspaceRoot: true

  route-check:
    command: "pnpm docs:check-route"
    options:
      cache: true
      runInCI: affected
      runFromWorkspaceRoot: true

  # The docs project has no `src/` or `tests/` tree — its only unit test is
  # `docs/.vitepress/sidebar.test.ts`, which imports `sidebar.ts`. The shared
  # test task hashes `**/*` within the project, which for docs globs nothing
  # under `.vitepress/`, so an edit to `sidebar.ts` would replay a stale green
  # docs test. Overriding `inputs` here *appends* (moon merges inputs by
  # default) — the shared entries stay, and this project additionally hashes
  # its `.vitepress/` tree where its tests and their imports actually live.
  test:
    command: 'vitest run --root "$workspaceRoot" --no-coverage --passWithNoTests "$projectRoot"'
    # The shared template's command is appended by default; this project's
    # command is identical, so without `mergeArgs: replace` the merged args
    # repeat the whole invocation (harmless but wasteful).
    options:
      mergeArgs: replace
    inputs:
      - ".vitepress/**"
