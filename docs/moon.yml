project:
  name: "docs"
  description: "The VitePress documentation site, built out of the library"

# The docs site has no package.json of its own — its build and route-check live
# in the root workspace package, so both tasks run with the shared flags and
# runFromWorkspaceRoot. Making the site a project means a change under docs/
# marks it affected, and `moon ci` runs the docs build/route-check instead of
# every diff silently skipping the site.
tasks:
  build:
    command: "pnpm docs:build"
    options:
      cache: true
      runInCI: affected
      runFromWorkspaceRoot: true

  route-check:
    command: "pnpm docs:check-route"
    options:
      cache: true
      runInCI: affected
      runFromWorkspaceRoot: true
