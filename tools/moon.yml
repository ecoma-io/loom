# Repository tooling project.
#
# `tools/` holds the architecture checker, the component-artifact gate and the
# moon-deps sync — the checks that keep the package graph honest. They have no
# package.json of their own (they run from the root workspace package under
# `node --experimental-strip-types`), so this project exists only to give a
# change under `tools/` a Moon home: editing the checker marks `tools`
# affected, and its inherited test task runs the architecture-rule tests
# (`tools/check-architecture.test.ts`) on the PR path instead of silently
# skipping them until the next push.
tags: ["layer-tooling"]
project:
  name: "tools"
  description: "Repository tooling — architecture checker, component artifacts, moon-deps sync"

# Three real cross-project reads that no package.json can express, because this
# project has none: the edges below are hand-declared under `# preserved`
# markers so an edit to any of the three files marks `tools` affected and
# re-runs the architecture-rule tests, instead of the change silently skipping
# them. tools/sync-moon-deps.ts never walks this file — it derives only from
# packages/ manifests — and the markers are still required here: every
# moon.yml that hand-declares an edge carries the same marker shape, and a
# future widened walk must be able to tell these edges from ones it may
# regenerate.
deps:
  # preserved — stage-docs.ts imports docs/.vitepress/base.ts; no specifier moon can see
  - "docs"
  # preserved — e2e-plan.ts imports playwright/profiles.ts; no specifier moon can see
  - "playwright"
  # preserved — e2e-plan.ts imports e2e/docs-pages.ts; no specifier moon can see
  - "e2e"

tasks:
  # Inherit lint and test from .moon/tasks/*.yml. The shared test task's
  # `"$projectRoot"` filter selects this project's own test files
  # (`tools/*.test.ts`); the shared inputs already hash the workspace-root
  # configs (vite.config.ts, tsconfig.json) this project's tests compile
  # against. Nothing project-specific needs overriding.
