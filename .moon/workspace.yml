# Moon workspace configuration for Loom.

projects:
  # Foundation packages.
  - "packages/core"
  - "packages/theme-core"
  - "packages/labels"
  # Component packages (one Moon project per component).
  - "packages/primitives/*"
  - "packages/composition/*"
  - "packages/blocks/*"
  - "packages/layouts/*"
  # The public facade.
  - "packages/loom"
  # The documentation site.
  - "docs"
  # Cross-cutting E2E.
  - "e2e"
  # Repository tooling — the architecture checker and its tests, the component
  # artifact check, moon-deps sync. `tooling/*` was a dead glob (the directory
  # is `tools/`, not `tooling/`), so the tools project never existed; naming it
  # explicitly makes a change under `tools/` mark this project affected and
  # run the architecture-rule tests on the PR path.
  - "tools"

vcs:
  client: git
  defaultBranch: main

# Constraints enforce the dependency direction.
# - library projects may depend on other libraries but not on applications
# - application projects may depend on libraries
# This prevents a component from accidentally importing the public facade.
constraints:
  enforceLayerRelationships: true
