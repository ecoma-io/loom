# Moonrepo toolchain configuration for Loom.
#
# The JavaScript toolchain manages pnpm installs and project dependency syncing.
# It does not replace pnpm — it reads the workspace that pnpm already defines
# and overlays its own project graph on top.
#
# syncProjectWorkspaceDependencies: when moon detects that project A depends on
# project B (via moon.yml dependsOn), it automatically adds a workspace
# dependency to A's package.json. This keeps pnpm and moon in agreement.
#
# packageManager: pnpm is declared explicitly so moon knows which lockfile and
# config files to watch, and which install command to run.

# Node toolchain — required by the JavaScript and pnpm toolchains. Moon uses
# this to determine which Node version to use for running tasks and to verify
# the environment. The version matches .node-version at the repository root.
node:
  version: "24.19.0"

pnpm:
  version: "11.20.0"

javascript:
  packageManager: pnpm
  syncProjectWorkspaceDependencies: true
  dedupeOnLockfileChange: true
