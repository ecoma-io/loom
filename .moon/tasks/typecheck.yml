# Shared typecheck task. Inherited by all projects.
#
# The type-check is whole-repo, and the whole-repo `vue-tsc` that exists to
# run it is the root `pnpm typecheck` (tsconfig.json includes every package,
# the docs site, the e2e specs and the repo tooling). Running that compile
# once per affiliated project (as this task's per-project command would) is a
# multi-pass re-check of the same files, multiplied by the number of
# projects — on a fresh CI runner with no moon cache, cold `vue-tsc` starts
# per project, so ~90 projects each type-checked everything took the verify
# job past its timeout before a single task finished. That is the same shape
# of mismatch the shared test task documents: coverage is a repository-wide
# contract, the suite is whole-repo, CI owns it as one global `pnpm test`,
# and this task stays for local per-project runs. Type-check gets the same
# treatment: `runInCI: skip` keeps `moon ci` from re-running the compile it
# does not own, CI gates the type-check with the global `pnpm typecheck` step
# after `moon ci`, and `moon :typecheck --affected` still serves a developer
# as the full-repo verdict it always was.
tasks:
  typecheck:
    command: "vue-tsc --noEmit"
    options:
      cache: true
      runInCI: skip
