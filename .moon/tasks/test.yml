# Shared test task. Inherited by all projects.
#
# Each project runs the tests it owns: `$projectRoot` is the Moon project's
# directory, and filtering the whole-repo Vitest include globs (`packages/**/*.test.ts`,
# `docs/**/*.test.ts`) by it means a project's own unit and integration files are
# the only ones executed. `--no-coverage` scopes per-project runs off the
# repository-wide coverage thresholds — those are a whole-repo contract owned by
# the global `pnpm test:full` (see package.json) — and `--passWithNoTests` keeps
# a source-only package (or one whose tests live elsewhere) green rather than
# failing with Vitest's "no test files found".
#
# The root vitest config keeps `maxWorkers: 1` (see vite.config.ts) — creating a
# jsdom per isolated file dominates the run, so several at once oversubscribe the
# machine and turn timing-sensitive tests flaky rather than faster. The
# repository-wide coverage thresholds were measured against that single worker;
# see the full `pnpm test:full` definition.
tasks:
  test:
    command: 'vitest run --root "$workspaceRoot" --no-coverage --passWithNoTests "$projectRoot"'
    # Declaring inputs replaces moon's default (the project's own files), so the
    # project glob is restated alongside the lockfile. The lockfile matters
    # because every dependency a test exercises arrives through it: without this
    # line a Renovate bump of vue or reka-ui marks no test task affected and a
    # dependency-bump pull request runs zero tests — measured, not hypothetical
    # (`moon query tasks --affected` on a lockfile-only diff selected nothing).
    # vite.config.ts is the vitest configuration (environment, setup, aliases)
    # and tsconfig.json the program every test compiles against — both live at
    # the workspace root, owned by no project, so without these lines an edit
    # to either marks nothing affected and runs zero tests.
    inputs:
      - "**/*"
      - "/pnpm-lock.yaml"
      - "/vite.config.ts"
      - "/tsconfig.json"
    options:
      cache: true
      runInCI: affected
