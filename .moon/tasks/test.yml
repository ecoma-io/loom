# Shared test task. Inherited by all projects.
#
# Each project runs the tests it owns: `$projectRoot` is the Moon project's
# directory, and filtering the whole-repo Vitest include globs (`packages/**/*.test.ts`,
# `docs/**/*.test.ts`) by it means a project's own unit and integration files are
# the only ones executed. `--no-coverage` scopes per-project runs off the
# repository-wide coverage thresholds — those are a whole-repo contract owned by
# the global `pnpm test:full` (see package.json) — and `--passWithNoTests` keeps
# a source-only package (or one whose tests live elsewhere) green rather than
# failing with Vitest's "no test files found".
#
# The root vitest config keeps `maxWorkers: 1` (see vite.config.ts) — creating a
# jsdom per isolated file dominates the run, so several at once oversubscribe the
# machine and turn timing-sensitive tests flaky rather than faster. The
# repository-wide coverage thresholds were measured against that single worker;
# see the full `pnpm test:full` definition.
tasks:
  test:
    command: 'vitest run --root "$workspaceRoot" --no-coverage --passWithNoTests "$projectRoot"'
    # Declaring inputs replaces moon's default (the project's own files), so the
    # project glob is restated alongside the lockfile. The lockfile matters
    # because every dependency a test exercises arrives through it: without this
    # line a Renovate bump of vue or reka-ui marks no test task affected and a
    # dependency-bump pull request runs zero tests — measured, not hypothetical
    # (`moon query tasks --affected` on a lockfile-only diff selected nothing).
    # vite.config.ts is the vitest configuration (environment, setup, aliases)
    # and tsconfig.json the program every test compiles against — both live at
    # the workspace root, owned by no project, so without these lines an edit
    # to either marks nothing affected and runs zero tests.
    #
    # `project://^?filter=src/**` is the dependency-source hash: it hashes the
    # `src/**` of every project this one *directly* depends on. Without it,
    # Moon's cache replays a dependent's stale green when its dependency
    # changes — the affected unit-test closure (the `moon query --downstream
    # deep` step in ci.yml) would select alert-dialog after a button edit but
    # replay its old cached result. This single shared entry closes that for
    # every project at once.
    #
    # `project://^?filter=package.json` is the same dependency-source hash for
    # the dependency's *contract* file. `src/**` alone would let an
    # `exports`/dependency change in a package.json (a new or removed export)
    # reach every dependent with their cache keys byte-identical — src/ did not
    # move — and replay green against a contract that just broke. Moon's
    # filter takes one glob, so the contract file is a second line rather than
    # a brace on the first.
    #
    # `^` is *direct* dependencies only. Moon hashes direct, not transitive,
    # dependency sources: at moon 2.4.6 the `^^` (transitive) URI is rejected
    # by the binary (`unknown_project_input` — "only project dependencies of
    # the parent project can be referenced"), and a measured cache
    # invalidation confirms the one-hop line holds — an edit to
    # packages/core/src/theme.ts leaves `loading-state:test` (whose declared
    # deps are skeleton and spinner only) replayed from cache. The transitive
    # layer is carried by *selection*, not hashing: `--downstream deep` picks
    # the whole closure, and every selected project's test re-runs against the
    # updated sources unless its own hash is unchanged. A transitive-only
    # source edit therefore cannot replay a stale green *in the run that
    # delivers it* — the selected dependent re-runs fresh. What the direct
    # hash does not cover is a cached green surviving across runs, which is a
    # KNOWN CACHE BOUNDARY, kept honest here rather than pretending `^` covers
    # the full closure.
    #
    # Where that boundary is answered has moved, so the claim is restated
    # rather than left to be inferred. The merge queue runs `moon run :test` —
    # every project, but against the cross-run `.moon/cache` ci.yml restores,
    # so a task whose own hash is unchanged replays there too. The uncached
    # run is the push to main: `pnpm test`, one vitest program over every test
    # file and no moon cache consulted, on every commit that lands. That is
    # the backstop, and it is also the only place the repository-wide coverage
    # thresholds are enforced — the per-project `command` above passes
    # `--no-coverage`, so `moon run :test` proves the tests and not the floor.
    inputs:
      - "**/*"
      - "/pnpm-lock.yaml"
      - "/vite.config.ts"
      - "/tsconfig.json"
      - "/vitest.setup.ts"
      - "project://^?filter=src/**"
      - "project://^?filter=package.json"
    options:
      cache: true
      runInCI: affected
      # A test that hangs must fail as its own task — moon names the timed-out
      # target — instead of running on until the Verify job's timeout-minutes
      # cancels the whole `moon run` with GitHub's only message, "The operation
      # was canceled", and no culprit (three Verify runs lost that way in one
      # concurrency burst on 2026-08-28, ecoma-io/loom#140). 300s mirrors the
      # shared e2e task's budget (.moon/tasks/e2e.yml) and sits ~13x above the
      # measured per-project duration (docs:test ≈ 22.7s at maxWorkers: 1,
      # described above).
      timeout: 300
