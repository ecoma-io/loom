deps:
  # preserved
  - "theme-core"
  # `accessibility.e2e.ts` imports WCAG_TAGS from `@ecoma-io/loom/a11y`, so the
  # gate and the library's published a11y claim are the same array. The edge is
  # real and this project has no package.json to declare it in.
  # preserved
  - "loom"

tags: ["layer-e2e", "e2e"]

project:
  name: "e2e"
  description: "Cross-cutting browser checks over the built documentation site"

tasks:
  e2e:
    # What this suite runs is the config's own collection, not a list here:
    # playwright.config.ts's `testMatch` (`e2e/**/*.e2e.ts`) gathers the whole
    # cross-cutting suite, and its `testIgnore` (`packages/**`) is what keeps
    # the component-owned specs out. Naming specs positionally forked that
    # collection and stranded whatever the copy missed — reduced-motion.e2e.ts
    # ran only through the config, never through this task.
    # The shared e2e task's command drives the component harness; this project
    # drives the built docs site instead, so the command is overridden here.
    # `runInCI: skip`: the dedicated e2e matrix job owns this suite (profile
    # and shard count decided per change by tools/e2e-plan.ts); moon ci in the
    # verify job must not run a second copy on top.
    command: "playwright test --config playwright.config.ts"
    options:
      runInCI: skip
    env:
      PW_PROFILE: "standard"
