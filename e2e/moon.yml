tags: ["e2e"]

project:
  name: "e2e"
  description: "Cross-cutting browser checks over the built documentation site"

tasks:
  e2e:
    # The cross-cutting suite lives here, not under a package — so each root
    # spec is named explicitly to avoid the `packages/**/e2e` shadow. A bare
    # `e2e/` substring would also match every component-owned spec.
    # `runInCI: skip`: the dedicated e2e job (sharded across 8 workers × 3
    # browsers) owns this suite; moon ci in the verify job must not run a
    # second copy on top.
    options:
      runInCI: skip
    args:
      - "e2e/accessibility.e2e.ts"
      - "e2e/contrast.e2e.ts"
      - "e2e/focus-not-obscured.e2e.ts"
      - "e2e/keyboard.e2e.ts"
      - "e2e/layout-responsive.e2e.ts"
      - "e2e/target-size.e2e.ts"
    env:
      PW_PROFILE: "standard"
